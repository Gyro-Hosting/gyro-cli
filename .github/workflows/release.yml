# Publishes a signed release on tag v*. Repository secrets:
#   GPG_PRIVATE_KEY, PASSPHRASE   - same release key as terraform-provider-gyro (E96BE963...A154B990)
#   HOMEBREW_TAP_TOKEN            - fine-grained PAT with write access to Gyro-Hosting/homebrew-tap (optional)
#   SCOOP_BUCKET_TOKEN            - fine-grained PAT with write access to Gyro-Hosting/scoop-bucket (optional)
# GHCR uses the built-in GITHUB_TOKEN (packages: write).
name: release
on:
  push:
    tags: ['v*']
permissions:
  contents: write
  packages: write
jobs:
  goreleaser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-go@v5
        with: {go-version-file: go.mod, cache: true}
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: import_gpg
        uses: crazy-max/ghaction-import-gpg@v6
        with:
          gpg_private_key: ${{ secrets.GPG_PRIVATE_KEY }}
          passphrase: ${{ secrets.PASSPHRASE }}
      - uses: goreleaser/goreleaser-action@v6
        with: {args: release --clean, version: '~> v2'}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GPG_FINGERPRINT: ${{ steps.import_gpg.outputs.fingerprint }}
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          SCOOP_BUCKET_TOKEN: ${{ secrets.SCOOP_BUCKET_TOKEN }}
