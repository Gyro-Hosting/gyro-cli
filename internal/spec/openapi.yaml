info:
  title: Gyro Public API
  version: 2.27.1
  summary: Manage Gyro cloud servers, SSH keys and billing programmatically.
  x-summary-tr: Gyro bulut sunucularınızı, SSH anahtarlarınızı ve faturalarınızı programla yönetin.
  description: "The Gyro Public API lets you automate everything you do in the Gyro client area:\norder and manage cloud servers, keep SSH keys, read invoices and\
    \ your account balance.\nIt is the API behind the official Terraform provider (`gyro-hosting/gyro`) and `gyroctl`.\n\n* **Base URL** `https://www.gyrohosting.com/api/v1/client`\n\
    * **Authentication** `Authorization: Bearer wck_...` (create keys in *Client area → account menu (top right) → API Credentials*)\n* **Format** JSON in, JSON out.\
    \ Successful answers are `{\"data\": ..., \"meta\": ...}`; errors are\n  `{\"error\": {\"code\", \"message\", \"details\"}}`.\n\n**v2**: every product line through\
    \ the generic service bridge (`/cloud/services`), webhooks, sub-account keys, reseller (bayi) end-customers, and the complete core client API (domains, DNS, tickets,\
    \ orders, invoices, account) under the same key.\n\n**2.10.0**: region `tr-ist-1` (Gyro Cloud Istanbul) on the same `/cloud/servers` endpoints, CLI commands and\
    \ Terraform resources; `GET /cloud/images?region=`; SSH keys installed after first boot in tr-ist-1 (`ssh_keys` on the server).\n\n**2.11.0**: prepaid hourly\
    \ billing from the account balance for Gyro Containers (ECS) and Gyro Cloud Istanbul (`billing: prepaid` on products and servers; `/cloud/billing/balance|usage|statement/{month}|estimate|topup-url`);\
    \ `/cloud/containers` (Gyro Containers).\n\n**2.13.0 (pre-sale)**: plan change for prepaid services through `/cloud/services/{id}/resize` (no invoice, `plan`\
    \ name accepted); tr-ist-1 reverse DNS create on new addresses + `status`; prepaid snapshot pricing on `/cloud/servers/{id}/snapshots`.\n\n**2.13.1**: Protected\
    \ Storage (versioning + object lock / WORM): `object_lock` on bucket create, versions list / restore / undelete / delete, bucket default retention, per-version\
    \ retention and legal hold, old version expiry, lock summary and scan. Standard Object Storage answers 409 `feature_not_available` on these.\n\n**2.14.0**: tr-ist-1\
    \ servers on Gyro Compute: SSH keys (up to 10) and `user_data` at creation through cloud-init (~25 s to SSH), `reset` action, rebuild with `user_data`, real snapshot\
    \ ids, metrics (instant), browser console URL. Request / response shapes unchanged.\n\n**2.15.0**: custom templates for tr-ist-1 servers: capture a server (`POST\
    \ /cloud/servers/{id}/templates`), list / rename / delete, new server (`POST /cloud/templates/{id}/servers`) or reinstall (`POST /cloud/templates/{id}/rebuild`)\
    \ from it. 0.05 EUR per GB-month (prepaid, hourly). No image upload.\n\n**2.16.0**: additional IPv4 addresses for tr-ist-1 servers: `GET/POST /cloud/servers/{id}/ips`,\
    \ `DELETE /cloud/servers/{id}/ips/{ip}` (hourly from the prepaid balance, default 2 EUR per address-month, up to 5 per server; configured on the server automatically).\n\
    \n**2.16.1**: `GET /cloud/apps` returns `min_ram_gb` (fixed), `min_disk_gb`, `min_cpu`, `popular_tr`, `version`, `license` and `description` for each one-click\
    \ app. Additive change.\n\n**2.17.0**: Gyro Containers: per-service autoscaling (`PUT /cloud/containers/{id}/services/{name}/autoscaling`, also `autoscaling`\
    \ / `alerts` on create and update), notification channels (`GET/PUT /cloud/containers/{id}/notifications`, `.../notifications/test`, `.../notifications/webhook-secret`:\
    \ e-mail, SMS, Telegram, signed webhook). Additive.\n\n**2.17.1**: additional IPv4: each added address is billed at least 6 hours (`pricing.minimum_hours`), per-server\
    \ add limit per hour (`adds_per_hour`, `adds_left_this_hour`). Additive.\n\n**2.17.2**: tr-ist-1 reverse DNS is published automatically: default PTR `<a-b-c-d>.ip.gyrohosting.com`\
    \ on every address, custom PTR live within seconds (`status: active`, new `default` flag), removed when the server/IP is released. Additive.\n\n**2.17.3**: tr-ist-1\
    \ snapshots: every additional snapshot is billed at least 1 hour (a snapshot created and deleted between two hourly counts is billed too). Text only.\n\n**2.17.4**:\
    \ Gyro Containers Serverless: `GET /cloud/billing/container-sizes` (vCPU / memory pairs and prices), `POST /cloud/billing/estimate` accepts `{\"type\": \"serverless\"\
    , \"cpu_m\", \"memory_mi\", \"count\", \"hours\"}` (no monthly cap, `capped` flag on every item). Additive.\n\n**2.17.5**: mount a Gyro Object Storage bucket\
    \ on a server: `GET/POST /cloud/servers/{id}/storage-mounts`, `GET/DELETE /cloud/servers/{id}/storage-mounts/{mid}`, `POST .../{mid}/command` (one-line installer,\
    \ automatic on tr-ist-1; one narrow key per mount; free). Additive.\n\n**2.18.0**: projects: `/cloud/projects` (list/create/get/update/delete, move services),\
    \ `PUT /cloud/services/{id}/project`, `project` on every service, `?project=` filter, optional `project_id` on order endpoints. Additive.\n\n**2.19.0**: additional\
    \ disks for tr-ist-1 servers: `GET/POST /cloud/servers/{id}/disks`, `PUT/DELETE /cloud/servers/{id}/disks/{disk}` (ssd or hdd class, per GB, hourly from the prepaid\
    \ balance; up to 4 disks per server, grow only).\n\n**2.19.1**: `POST /cloud/servers/{id}/actions/rebuild` accepts `app` and `app_domain` (one-click app on top\
    \ of the reinstall; response `app_install_id`); `POST /cloud/servers/{id}/app` also on tr-ist-1. Install status `kaldirildi` = removed by a later reinstall. Additive.\n\
    \n**2.20.0**: Protected Storage buckets can be mounted on servers (`/cloud/servers/{id}/storage-mounts`, read-only by default, read/write needs `accept_versioning:\
    \ true`, field `protected`) and renamed (`POST /cloud/storage/{id}/buckets/{bucket}/rename`: display name + website address change, S3 name stays, `s3_name` in\
    \ bucket lists). Additive.\n\n**2.20.1**: documentation only (example values). No functional change.\n\n**2.21.0**: batch create: `POST /cloud/servers` takes\
    \ `quantity` (N servers in one order), `name` (`{n}` template) / `tags` and `app`; container environments can be ordered through the API: `GET /cloud/containers/plans`,\
    \ `POST /cloud/containers` (`quantity`, `name`, `tags`, `project_id`). Additive.\n\n**2.22.0**: container image import: `POST /cloud/containers/{id}/registry/imports`\
    \ copies an image from Docker Hub, GitHub, Quay or another https registry into the environment's Gyro registry (no `docker push`; optional token, never stored),\
    \ `GET .../registry/imports` shows progress. Additive.\n\n**2.23.0**: Gyro Pipeline for containers: `/cloud/containers/{id}/pipelines` connects a GitHub / GitLab\
    \ / Gitea / https git repository; a push or tag (webhook) or `POST .../runs` builds the Dockerfile in an isolated build environment, pushes `<registry>/<code>/<image>:<sha7>`\
    \ and rolls the target services out with health watch and automatic rollback. Runs, live logs, approval and redeploy under `/cloud/containers/{id}/pipeline-runs/{run}`.\
    \ Additive.\n\n**2.24.0**: Gyro Pipeline: archive builds (`POST .../pipelines/{pipeline}/uploads` gives a presigned upload URL, tar.gz / zip up to 200 MB, kept\
    \ 24 h; then `POST .../runs {\"upload_id\"}`; provider `archive` = pipelines without a repository) and private repositories over SSH (`PUT .../deploy-key` creates\
    \ an ed25519 deploy key, only the public key is returned; `GET/PUT .../host-key` shows and confirms the server key; GitHub / GitLab / Bitbucket keys are pinned).\
    \ Additive.\n\n**2.24.1**: Containers: `command` / `args` also accept a plain string, split like a shell with quotes respected (invalid JSON array / unclosed\
    \ quote -> 400). Service updates, restarts and rollbacks are seamless even when the node pool is full (the new copy starts on a shared sandboxed pool and moves\
    \ back); the response carries `rollout`: `seamless` | `brief_interruption`. Service `state` may be `preparing` (the environment's node is being installed) with\
    \ `eta_s`. Serverless: at most 672 charged hours a calendar month; billing estimate default `hours` 672, `billed_hours`. Additive.\n\n**2.24.2**: Serverless containers\
    \ are billed for the full month again: no monthly cap (`capped: false`), billing estimate default `hours` 730 (a full month), `monthly_cap` = 730 hours, `total`\
    \ = `hours` x hourly; `billed_hours` kept (= `hours`). Replaces the 672-hour serverless ceiling announced in 2.24.1. Capped plans (servers, dedicated nodes) unchanged.\n\
    \n**2.24.3**: Security groups: a rule change that removes or narrows SSH/RDP access for a source on an attached server is a 5 minute trial on every path (API\
    \ included; before only when the caller's own address was cut); the group object has `trial` and `trial_seconds_left` also while `applying`. Deleting a server\
    \ removes its group attachments, so the group can be deleted. Group changes are written to each attached server's change log.\n\n**2.24.4**: Container services:\
    \ a replica count (scale, create, update, autoscaling max) outside the plan limit is refused with 422 `invalid_replicas` and the message names the limit (`details.max`).\
    \ GET /cloud/servers/{id}: Gyro Compute servers in tr-ist-1 show the SSH keys given at creation (`ssh_keys.fingerprints`, `ssh_keys.key_ids`, `method: cloud-init`;\
    \ `state: none` when no key was given) instead of null.\n\n**2.25.0**: Object Storage and Protected Storage can be ordered through the API: `GET /cloud/storage/plans`,\
    \ `POST /cloud/storage` (plan, cycle, quantity, extra_traffic, object_lock_buckets, name/tags/project_id; paid from the balance), `GET /cloud/storage`, `GET|DELETE\
    \ /cloud/storage/{id}`. Plan change: documented data safety, `data_preserved`/`disk`/`restart` in the answer, resize-options marks smaller-disk plans `allowed:\
    \ false` and a smaller disk is refused with 409 `disk_shrink` already in `dry_run`; clearer `recreate_required` message. Additive.\n\n**Limits**: every account\
    \ limit and its usage is listed by `GET /cloud/account/limits` (`gyro limits`). **Account limits are raised with a support ticket** (`POST /api/v1/client/tickets`,\
    \ `gyro ticket create`). Every refusal caused by a limit carries `error.details.limit_exceeded: true`, `limit_key`, `limit`, `current`, `how_to_increase` and\
    \ a ready `support_ticket` request.\n\n**2.26.0**: `GET /cloud/account/limits`; structured limit hint in limit errors (new-account limit of the prepaid cloud\
    \ now answers `limit_exceeded` instead of `checkout_blocked`, original code in `details.reason`); dry-run quotes of servers, container environments and templates\
    \ show `quote.limit_exceeded`; new-account limit raised to 5 servers. Additive.\n\n**2.27.0**: `GET /cloud/containers/{id}` (environment detail: Kubernetes `namespace`,\
    \ in-cluster addressing `cluster_dns`, `egress_ips`) and `GET /cloud/containers/{id}/egress-ips` (current egress IPv4 addresses for IP allow lists; dedicated\
    \ = own nodes + shared pool during updates, serverless = shared pool); service detail has `internal` (`<service>.<namespace>.svc.cluster.local:80`), service list\
    \ `internal_address`; egress IP changes are notified (alert event `egress`). Additive.\n\n**2.27.1**: `PUT /cloud/containers/{id}/services/{name}/env` rejects\
    \ unknown fields and empty changes with 422 `invalid_env` (was: success without change).\n"
  x-description-tr: "Gyro Public API, müşteri panelinde yaptığınız her işi otomatikleştirmenizi sağlar:\nbulut sunucu siparişi ve yönetimi, SSH anahtarları, fatura\
    \ ve bakiye okuma.\nResmi Terraform sağlayıcısı (`gyro-hosting/gyro`) ve `gyroctl` bu API'yi kullanır.\n\n* **Taban adres** `https://www.gyrohosting.com/api/v1/client`\n\
    * **Kimlik** `Authorization: Bearer wck_...` (anahtarı *Müşteri paneli → sağ üstteki hesap menüsü → API Kimlik Bilgileri* bölümünden oluşturun)\n* **Biçim** JSON\
    \ gönderilir, JSON döner. Başarılı yanıt `{\"data\": ..., \"meta\": ...}`, hata\n  `{\"error\": {\"code\", \"message\", \"details\"}}` biçimindedir.\n\n**v2**:\
    \ genel hizmet köprüsüyle tüm ürün hatları (`/cloud/services`), webhook'lar, alt hesap anahtarları, bayi uç-müşterileri ve aynı anahtarla çekirdek müşteri API'sinin\
    \ tamamı (alan adı, DNS, destek, sipariş, fatura, hesap).\n\n**2.10.0**: aynı `/cloud/servers` uçları, CLI komutları ve Terraform kaynaklarıyla `tr-ist-1` bölgesi\
    \ (Gyro Bulut İstanbul); `GET /cloud/images?region=`; tr-ist-1'de SSH anahtarları ilk açılıştan sonra yüklenir (sunucuda `ssh_keys`).\n\n**2.11.0**: Gyro Kapsayıcı\
    \ (ECS) ve Gyro Bulut İstanbul için bakiyeden saatlik ön ödemeli faturalama (ürün ve sunucularda `billing: prepaid`; `/cloud/billing/balance|usage|statement/{month}|estimate|topup-url`);\
    \ `/cloud/containers` (Gyro Kapsayıcı).\n\n**2.13.0 (satış öncesi)**: ön ödemeli hizmetlerde `/cloud/services/{id}/resize` ile plan değişikliği (fatura yok, `plan`\
    \ adı kabul edilir); tr-ist-1'de yeni IP'de ters DNS oluşturma + `status`; ön ödemeli snapshot fiyatı.\n\n**2.13.1**: Korumalı Depolama (sürümleme + nesne kilidi\
    \ / WORM): kova açılışında `object_lock`, sürüm listele / geri yükle / silme işaretini kaldır / kalıcı sil, kova varsayılan saklaması, sürüm başına saklama ve\
    \ legal hold, eski sürüm silme süresi, kilit özeti ve tarama. Standart Nesne Depolama bu uçlarda 409 `feature_not_available` döner.\n\n**2.14.0**: tr-ist-1 sunucuları\
    \ Gyro Compute üzerinde: oluşturmada cloud-init ile SSH anahtarları (en çok 10) ve `user_data` (SSH'a ~25 sn), `reset` eylemi, `user_data` ile yeniden kurulum,\
    \ gerçek snapshot numaraları, anlık metrikler, tarayıcı konsolu adresi. İstek / yanıt biçimleri değişmedi.\n\n**2.15.0**: tr-ist-1 sunucuları için özel şablonlar:\
    \ sunucudan şablon (`POST /cloud/servers/{id}/templates`), listele / adlandır / sil, şablondan yeni sunucu (`POST /cloud/templates/{id}/servers`) ya da yeniden\
    \ kurulum (`POST /cloud/templates/{id}/rebuild`). GB başına aylık 0,05 € (ön ödemeli, saatlik). Dışarıdan imaj yüklenmez.\n\n**2.16.0**: tr-ist-1 sunucularına\
    \ ek IPv4: `GET/POST /cloud/servers/{id}/ips`, `DELETE /cloud/servers/{id}/ips/{ip}` (ön ödemeli bakiyeden saatlik, varsayılan adres başına aylık 2 €, sunucu\
    \ başına en çok 5; sunucuya otomatik tanımlanır).\n\n**2.16.1**: `GET /cloud/apps` her tek tık uygulama için `min_ram_gb` (düzeltildi), `min_disk_gb`, `min_cpu`,\
    \ `popular_tr` (Türkiye'de popüler), `version`, `license` ve `description` döndürür. Geriye uyumlu ekleme.\n\n**2.17.0**: Gyro Kapsayıcı: servis başına otomatik\
    \ ölçekleme (`PUT /cloud/containers/{id}/services/{name}/autoscaling`, oluştur/güncellemede `autoscaling` / `alerts`), bildirim kanalları (`GET/PUT /cloud/containers/{id}/notifications`,\
    \ `.../notifications/test`, `.../notifications/webhook-secret`: e-posta, SMS, Telegram, imzalı webhook). Geriye uyumlu.\n\n**2.17.1**: ek IPv4: her eklenen adres\
    \ en az 6 saat ücretlendirilir (`pricing.minimum_hours`), sunucu başına saatlik ekleme sınırı (`adds_per_hour`, `adds_left_this_hour`). Geriye uyumlu.\n\n**2.17.2**:\
    \ tr-ist-1 ters DNS otomatik yayında: her adreste varsayılan PTR `<a-b-c-d>.ip.gyrohosting.com`, özel PTR saniyeler içinde (`status: active`, yeni `default` alanı),\
    \ sunucu/IP bırakılınca silinir. Geriye uyumlu.\n\n**2.17.3**: tr-ist-1 snapshot: her ek snapshot en az 1 saat ücretlenir (iki saatlik sayım arasında oluşturulup\
    \ silinen de). Yalnız metin.\n\n**2.17.4**: Gyro Kapsayıcı Sunucusuz: `GET /cloud/billing/container-sizes` (vCPU / bellek çiftleri ve fiyatlar), `POST /cloud/billing/estimate`\
    \ `{\"type\": \"serverless\", \"cpu_m\", \"memory_mi\", \"count\", \"hours\"}` kabul eder (aylık tavan yok, her kalemde `capped`). Geriye uyumlu.\n\n**2.17.5**:\
    \ Nesne Depolama kovasını sunucuya bağlama: `GET/POST /cloud/servers/{id}/storage-mounts`, `GET/DELETE /cloud/servers/{id}/storage-mounts/{mid}`, `POST .../{mid}/command`\
    \ (tek satır kurulum, tr-ist-1'de otomatik; bağlantı başına dar anahtar; ücretsiz). Geriye uyumlu.\n\n**2.18.0**: projeler: `/cloud/projects` (listele/oluştur/getir/güncelle/sil,\
    \ hizmet taşı), `PUT /cloud/services/{id}/project`, her hizmette `project`, `?project=` süzgeci, sipariş uçlarında isteğe bağlı `project_id`. Geriye uyumlu.\n\
    \n**2.19.0**: tr-ist-1 sunucularına ek disk: `GET/POST /cloud/servers/{id}/disks`, `PUT/DELETE /cloud/servers/{id}/disks/{disk}` (ssd ya da hdd sınıfı, GB başına,\
    \ ön ödemeli bakiyeden saatlik; sunucu başına en çok 4 disk, yalnız büyür).\n\n**2.19.1**: `POST /cloud/servers/{id}/actions/rebuild` `app` ve `app_domain` alır\
    \ (yeniden kurulum + tek tıkla uygulama; yanıtta `app_install_id`); `POST /cloud/servers/{id}/app` tr-ist-1'de de çalışır. Kurulum durumu `kaldirildi` = sonraki\
    \ yeniden kurulumla kaldırıldı. Geriye uyumlu.\n\n**2.20.0**: Korumalı Depolama kovaları sunucuya bağlanabilir (varsayılan salt okuma, okuma-yazma `accept_versioning:\
    \ true` ister, `protected` alanı) ve adı değiştirilebilir (görünen ad + web adresi değişir, S3 adı sabit, kova listelerinde `s3_name`). Geriye uyumlu.\n\n**2.20.1**:\
    \ yalnız belge (örnek değerler). İşlev değişikliği yok.\n\n**2.21.0**: toplu oluşturma: `POST /cloud/servers` `quantity` (tek siparişte N sunucu), `name` (`{n}`\
    \ şablonu) / `tags` ve `app` alır; kapsayıcı ortamları API ile açılabilir: `GET /cloud/containers/plans`, `POST /cloud/containers` (`quantity`, `name`, `tags`,\
    \ `project_id`). Geriye uyumlu.\n\n**2.22.0**: kapsayıcı imaj içe aktarma: `POST /cloud/containers/{id}/registry/imports` Docker Hub, GitHub, Quay ya da başka\
    \ bir https depodaki imajı ortamın Gyro deposuna kopyalar (`docker push` yok; isteğe bağlı token saklanmaz), `GET .../registry/imports` ilerlemeyi gösterir. Geriye\
    \ uyumlu.\n\n**2.23.0**: Kapsayıcılar için Gyro Pipeline: `/cloud/containers/{id}/pipelines` GitHub / GitLab / Gitea / https git deposu bağlar; push ya da etiket\
    \ (webhook) veya `POST .../runs` Dockerfile'ı yalıtılmış ortamda derler, `<depo>/<kod>/<imaj>:<sha7>` olarak yükler ve hedef servisleri sağlık kontrolü + otomatik\
    \ geri dönüşle yeni sürüme geçirir. Çalıştırmalar, canlı log, onay ve yeniden dağıtım `/cloud/containers/{id}/pipeline-runs/{run}` altında. Geriye uyumlu.\n\n\
    **2.24.0**: Gyro Pipeline: arşivden derleme (`POST .../pipelines/{pipeline}/uploads` ön imzalı yükleme adresi verir, tar.gz / zip en çok 200 MB, 24 saat saklanır;\
    \ sonra `POST .../runs {\"upload_id\"}`; provider `archive` = depo olmadan) ve SSH ile özel depolar (`PUT .../deploy-key` ed25519 deploy key üretir, yalnız açık\
    \ anahtar döner; `GET/PUT .../host-key` sunucu anahtarını gösterir ve onaylar; GitHub / GitLab / Bitbucket anahtarları sabit). Geriye uyumlu.\n\n**2.24.1**: Kapsayıcı:\
    \ `command` / `args` düz metin de kabul eder, tırnaklara uyan kabuk bölmesiyle (geçersiz JSON dizi / kapanmamış tırnak -> 400). Servis güncelleme, yeniden başlatma\
    \ ve geri alma düğüm havuzu doluyken de kesintisiz (yeni kopya paylaşımlı yalıtılmış alanda başlar, sonra geri döner); yanıtta `rollout`: `seamless` | `brief_interruption`.\
    \ Servis `state` değeri `preparing` olabilir (ortamın düğümü kuruluyor), `eta_s` ile. Sunucusuz: bir takvim ayında en çok 672 saat ücretlenir; ücret tahmininde\
    \ varsayılan `hours` 672, `billed_hours`. Geriye uyumlu.\n\n**2.24.2**: Sunucusuz kapsayıcılar yeniden tam ay ücretlenir: aylık tavan yok (`capped: false`), ücret\
    \ tahmininde varsayılan `hours` 730 (tam ay), `monthly_cap` = 730 saat, `total` = `hours` x saatlik; `billed_hours` korunur (= `hours`). 2.24.1'deki 672 saatlik\
    \ Sunucusuz tavanının yerine geçer. Tavanlı planlar (sunucu, ayrılmış düğüm) değişmedi.\n\n**2.24.3**: Güvenlik grupları: bağlı bir sunucuda bir kaynağın SSH/RDP\
    \ erişimini kaldıran ya da daraltan kural değişikliği her yoldan (API dahil; önceden yalnız çağıranın kendi adresi kesilince) 5 dakikalık denemedir; grup nesnesinde\
    \ `trial` ve `trial_seconds_left` `applying` sırasında da dolu. Sunucu silinince grup bağları kalkar, grup silinebilir. Grup değişiklikleri bağlı her sunucunun\
    \ değişiklik kaydına yazılır.\n\n**2.24.4**: Kapsayıcı servisleri: plan sınırı dışındaki kopya sayısı (ölçek, oluşturma, güncelleme, otomatik ölçek max) 422 `invalid_replicas`\
    \ ile reddedilir, mesaj sınırı söyler (`details.max`). GET /cloud/servers/{id}: tr-ist-1 Gyro Compute sunucularında oluşturmada verilen SSH anahtarları görünür\
    \ (`ssh_keys.fingerprints`, `ssh_keys.key_ids`, `method: cloud-init`; anahtar verilmediyse `state: none`), önceden null idi.\n\n**2.25.0**: Nesne Depolama ve\
    \ Korumalı Depolama API'den sipariş edilebilir: `GET /cloud/storage/plans`, `POST /cloud/storage` (plan, cycle, quantity, extra_traffic, object_lock_buckets,\
    \ name/tags/project_id; bakiyeden ödenir), `GET /cloud/storage`, `GET|DELETE /cloud/storage/{id}`. Plan değişikliği: veri güvencesi belgelendi, yanıtta `data_preserved`/`disk`/`restart`,\
    \ resize-options daha küçük diskli planları `allowed: false` gösterir ve küçük disk `dry_run`'da da 409 `disk_shrink` ile reddedilir; `recreate_required` mesajı\
    \ netleşti. Geriye uyumlu.\n\n**Sınırlar**: hesabın tüm sınırları ve kullanımı `GET /cloud/account/limits` (`gyro limits`) ile listelenir. **Hesap sınırları destek\
    \ talebiyle artırılır** (`POST /api/v1/client/tickets`, `gyro ticket create`). Sınır kaynaklı her ret `error.details.limit_exceeded: true`, `limit_key`, `limit`,\
    \ `current`, `how_to_increase` ve hazır `support_ticket` isteğini taşır.\n\n**2.26.0**: `GET /cloud/account/limits`; sınır hatalarında yapılandırılmış ipucu (ön\
    \ ödemeli bulutun yeni hesap sınırı artık `checkout_blocked` yerine `limit_exceeded`, eski kod `details.reason`); sunucu, kapsayıcı ortamı ve şablon dry-run tekliflerinde\
    \ `quote.limit_exceeded`; yeni hesap sınırı 5 sunucu. Geriye uyumlu.\n\n**2.27.0**: `GET /cloud/containers/{id}` (ortam ayrıntısı: Kubernetes `namespace`, iç\
    \ adresleme `cluster_dns`, `egress_ips`) ve `GET /cloud/containers/{id}/egress-ips` (IP beyaz listesi için güncel çıkış IPv4 adresleri; ayrılmış = kendi düğümleri\
    \ + güncellemede paylaşımlı havuz, sunucusuz = paylaşımlı havuz); servis ayrıntısında `internal` (`<servis>.<namespace>.svc.cluster.local:80`), servis listesinde\
    \ `internal_address`; çıkış IP değişikliği bildirilir (uyarı olayı `egress`). Geriye uyumlu.\n\n**2.27.1**: `PUT /cloud/containers/{id}/services/{name}/env` bilinmeyen\
    \ alanı ve boş değişikliği 422 `invalid_env` ile reddeder (önce: değişiklik olmadan başarı).\n"
  contact:
    name: Gyro Hosting
    url: https://www.gyrohosting.com
  license:
    name: Proprietary
    identifier: LicenseRef-Gyro-API-Terms
servers:
- url: https://www.gyrohosting.com/api/v1/client
  description: Production
security:
- bearerAuth: []
tags:
- name: Servers
  description: Cloud servers you own. Creating one places an order paid from your account balance.
  x-description-tr: Sahip olduğunuz bulut sunucular. Oluşturma, hesap bakiyesinden ödenen bir sipariştir.
- name: Server actions
  description: Power, rebuild, password and rescue operations. Asynchronous; poll the server until `live.locked` is false.
  x-description-tr: Güç, yeniden kurulum, parola ve kurtarma işlemleri. Eşzamansızdır; `live.locked` false olana kadar sunucuyu sorgulayın.
- name: Snapshots and backups
  description: Point-in-time images of a server disk. Snapshot space is an add-on quota in GB.
  x-description-tr: Sunucu diskinin anlık görüntüleri. Snapshot alanı GB cinsinden ek hizmet kotasıdır.
- name: Networking
  description: Reverse DNS and the inbound firewall of a server.
  x-description-tr: Sunucunun ters DNS kayıtları ve gelen trafik güvenlik duvarı.
- name: Monitoring
  description: CPU, disk and network metrics and the provider-side action history.
  x-description-tr: CPU, disk ve ağ ölçümleri ile sunucu işlem geçmişi.
- name: SSH keys
  description: Account-level public keys you can install on new servers.
  x-description-tr: Yeni sunuculara kurulabilen, hesap düzeyinde açık anahtarlar.
- name: Catalog
  description: Orderable products, locations and operating system images.
  x-description-tr: Sipariş verilebilen ürünler, lokasyonlar ve işletim sistemi imajları.
- name: Billing
  description: Invoices and account balance (read-only with the recommended scopes).
  x-description-tr: Faturalar ve hesap bakiyesi (önerilen kapsamlarla salt okunur).
- name: Account
  description: Key introspection and the write log of your API keys.
  x-description-tr: Anahtar bilgisi ve API anahtarlarınızın yazma kaydı.
- name: Services (all products)
  description: 'Generic bridge to every product line (cloud server, VDS, dedicated, mail, monitor, storage, license, ...).

    Everything a customer can do on a service in the client area is a module tool or method and is reachable here.

    Start with `GET /cloud/services/{id}/tools`: it lists the tools, their actions and our safety policy

    (`read`, `confirm`, `secret`) for that very service.

    '
  x-description-tr: 'Tüm ürün hatlarına (bulut sunucu, VDS, fiziksel sunucu, kurumsal mail, izleme, depolama, lisans, ...) genel köprü.

    Müşteri panelinde bir hizmette yapılabilen her şey bir modül aracı ya da metodudur ve burada erişilebilir.

    `GET /cloud/services/{id}/tools` ile başlayın: o hizmetin araçlarını, eylemlerini ve güvenlik politikasını

    (`read`, `confirm`, `secret`) döndürür.

    '
- name: Webhooks
  description: Signed HTTPS callbacks for service, invoice, order and ticket events.
  x-description-tr: Hizmet, fatura, sipariş ve talep olayları için imzalı HTTPS geri çağrıları.
- name: API keys
  description: Sub-account keys narrowed to services, actions or a reseller end-customer. Only GyroAPI `/cloud` routes accept them.
  x-description-tr: Hizmet, eylem ya da bayi uç-müşterisiyle daraltılmış alt hesap anahtarları. Yalnız GyroAPI `/cloud` uçlarında geçerlidir.
- name: Reseller
  description: Reseller (bayi) accounts manage their own end-customers, assign services, mint end-customer keys and read usage reports. Services stay on the reseller
    account and use its discount.
  x-description-tr: Bayi hesapları kendi uç-müşterilerini yönetir, hizmet atar, uç-müşteri anahtarı üretir ve kullanım raporu okur. Hizmetler bayinin hesabında kalır
    ve bayi indirimiyle fiyatlanır.
- name: Mail
  description: Typed corporate-mail shortcuts (mailboxes, aliases, catch-all, auto-responders, IMAP migrations, DNS, spam, delivery log, quarantine, deleted mail,
    archive, 2FA). Mailboxes are addressed by local part.
  x-description-tr: Kurumsal mail kısayolları (kutular, takma adlar, catch-all, otomatik yanıt, IMAP taşıma, DNS, spam, teslim kaydı, karantina, silinen posta, arşiv,
    2FA). Kutular yerel kısımla (@ öncesi) adreslenir.
- name: Object storage
  description: 'Typed S3 storage shortcuts: buckets, access keys (secret shown once), usage, connection details.'
  x-description-tr: 'S3 depolama kısayolları: kovalar, erişim anahtarları (gizli bir kez), kullanım, bağlantı bilgisi.'
- name: Monitoring (uptime)
  description: 'Typed uptime-monitor shortcuts: monitors, channels, heartbeats, status pages.'
  x-description-tr: 'Uptime izleme kısayolları: monitörler, kanallar, heartbeat, durum sayfaları.'
- name: Licenses
  description: Software license status and IP change.
  x-description-tr: Yazılım lisansı durumu ve IP değişikliği.
- name: One-click apps
  description: Install a one-click app on a cloud server (the disk is rebuilt).
  x-description-tr: Bulut sunucuya tek tık uygulama kur (disk yeniden kurulur).
- name: Plan changes and add-ons
  description: 'Resize (plan upgrade) and add-on purchase, paid from the account balance (dry_run, confirm, Idempotency-Key, daily limit: default 50 paid operations
    per account, per-account/reseller override, 429 daily_limit).'
  x-description-tr: 'Paket yükseltme ve ek hizmet satın alma; bakiyeden ödenir (dry_run, confirm, Idempotency-Key, günlük sınır: hesap başına varsayılan 50 ücretli
    işlem, hesap/bayi bazında istisna, 429 daily_limit).'
- name: Panel users
  description: 'Sub-users: extra panel logins with limited permissions (accountant, technical staff). Scope `users`.'
  x-description-tr: 'Alt kullanıcılar: sınırlı izinli ek panel girişleri (muhasebe, teknik ekip). Kapsam `users`.'
- name: Load balancers
  description: 'Managed L4/L7 load balancer for your cloud servers: services, health checks, targets, free Let''s Encrypt certificates, metrics. EU regions.'
  x-description-tr: 'Bulut sunucularınız için yönetilen L4/L7 yük dengeleyici: servisler, sağlık kontrolü, hedefler, ücretsiz Let''s Encrypt sertifikası, ölçümler.
    AB bölgeleri.'
- name: Containers
  description: 'Gyro Containers (ECS), Istanbul tr-ist-1: run Docker images on a node pool dedicated to you (no other customer''s containers on your nodes). Services
    with zero-downtime deploys, revision history and rollback, scaling, environment variables and encrypted secrets, HTTPS address <name>-<code>.gyroapp.net plus
    your own domains (free certificates), logs and metrics. Order the environment like any product (`/cloud/services` lists it); manage it here.'
  x-description-tr: 'Gyro Kapsayıcı (ECS), İstanbul tr-ist-1: Docker imajlarını size ayrılmış düğüm havuzunda çalıştırın. Kesintisiz dağıtım, sürüm geçmişi ve geri
    alma, ölçekleme, ortam değişkenleri ve şifreli gizli değerler, <ad>-<kod>.gyroapp.net HTTPS adresi ve kendi alan adlarınız (ücretsiz sertifika), loglar ve grafikler.'
- name: Managed DNS
  description: 'Authoritative DNS on ns1.gyrodns.net (Istanbul) + ns2.gyrodns.net (Germany): zones, records (A/AAAA/CNAME/MX/TXT/SRV/CAA/ALIAS/NS/PTR), BIND import/export,
    one-click DNSSEC, health-checked failover records.'
  x-description-tr: 'ns1.gyrodns.net (İstanbul) + ns2.gyrodns.net (Almanya) yetkili DNS: zone''lar, kayıtlar, BIND içe/dışa aktarma, tek tık DNSSEC, sağlık kontrollü
    failover kayıtları.'
- name: Security groups
  description: 'Reusable allow lists (AWS security group model) for servers with the network firewall add-on. Up to 5 groups per server, evaluated after Gyro rules
    and your advanced ordered rules; with groups and no advanced rules inbound traffic is denied by default. Rules count against the server''s rule allowance. A change
    that could cut SSH/RDP access runs as a 5 minute trial: confirm it.'
  x-description-tr: 'Ağ güvenlik duvarı ek hizmeti olan sunucular için yeniden kullanılabilir izin listeleri (AWS security group modeli). Sunucu başına en çok 5 grup;
    Gyro kuralları ve gelişmiş sıralı kurallarınızdan sonra değerlendirilir; grup olup gelişmiş kural yoksa gelen trafik varsayılan olarak kapalıdır. Kurallar sunucunun
    kural hakkından düşer. SSH/RDP erişimini kesebilecek değişiklik 5 dakikalık deneme olarak uygulanır: onaylayın.'
- name: Reference data
  description: Countries, states, cities.
  x-description-tr: Ülke, il, ilçe.
- name: Services (core)
  description: 'Core service endpoints: renew, cancel, auto-renew, add-ons, metrics, SSO, password.'
  x-description-tr: 'Çekirdek hizmet uçları: yenileme, iptal, otomatik yenileme, ek hizmetler, ölçümler, SSO, parola.'
- name: Domains and DNS
  description: Register, transfer, renew, nameservers, DNS records, DNSSEC, lock, EPP code, privacy, WHOIS contacts, forwarding (core WISECP client API).
  x-description-tr: Kayıt, transfer, yenileme, ad sunucuları, DNS kayıtları, DNSSEC, kilit, EPP kodu, gizlilik, WHOIS kişileri, yönlendirme (çekirdek WISECP müşteri
    API'si).
- name: Orders
  description: Preview (quote) and place orders for any product.
  x-description-tr: Her ürün için teklif ve sipariş.
- name: Support tickets
  description: Departments, open, reply, close, reopen, rate, attachments.
  x-description-tr: Departmanlar, aç, yanıtla, kapat, yeniden aç, puanla, ekler.
- name: SMS
  description: SMS senders, quote and send.
  x-description-tr: SMS başlıkları, teklif ve gönderim.
- name: Affiliate
  description: Affiliate programme.
  x-description-tr: Satış ortaklığı.
- name: Templates
  description: Custom templates from your own tr-ist-1 servers (no image upload)
  x-description-tr: Kendi tr-ist-1 sunucularınızdan özel şablonlar (dışarıdan imaj yüklenmez)
- name: Projects
  description: Group your services into projects (e.g. one per business, client or environment). Every service is in exactly one project; services without one are
    in the default project (id 0). Invoices are not split by project.
  x-description-tr: Hizmetlerinizi projelere ayırın (iş, müşteri ya da ortam başına). Her hizmet tek bir projededir; atanmamış hizmetler varsayılan projededir (id
    0). Faturalar projeye göre bölünmez.
- name: Account limits
  description: 'Every limit of your account and its current usage in one place. Limits are raised on request: open a support ticket.'
  x-description-tr: 'Hesabınızın tüm sınırları ve şu anki kullanım tek yerde. Sınırlar talep üzerine artırılır: destek talebi açın.'
paths:
  /whoami:
    get:
      tags:
      - Account
      operationId: whoami
      summary: Describe the calling API key
      x-summary-tr: Çağıran API anahtarını göster
      x-scope: any
      responses:
        '200':
          description: Key details
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      id:
                        type: integer
                      type:
                        type: string
                        const: client
                      name:
                        type: string
                      permissions:
                        type: array
                        items:
                          type: string
                      owner_id:
                        type: integer
        '401':
          $ref: '#/components/responses/Unauthorized'
  /cloud/activity:
    get:
      tags:
      - Account
      operationId: listActivity
      summary: List write calls made with your API keys
      x-summary-tr: API anahtarlarınızla yapılan yazma çağrılarını listele
      description: Every non-GET call to `/cloud/...` is recorded for 365 days (method, path, scope, HTTP status, IP, key id). Request and response bodies are never
        stored.
      x-description-tr: '`/cloud/...` altındaki her GET dışı çağrı 365 gün saklanır (yöntem, yol, kapsam, HTTP durumu, IP, anahtar no). İstek ve yanıt gövdeleri saklanmaz.'
      x-scope: cloud_read
      parameters:
      - $ref: '#/components/parameters/Page'
      - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Activity page
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/ActivityEntry'
                  meta:
                    $ref: '#/components/schemas/PageMeta'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /cloud/products:
    get:
      tags:
      - Catalog
      operationId: listProducts
      summary: List orderable cloud server products
      x-summary-tr: Sipariş verilebilen bulut sunucu ürünlerini listele
      description: Prices are in the product currency, VAT excluded. `available=false` means temporarily out of stock.
      x-description-tr: Fiyatlar ürün para biriminde ve KDV hariçtir. `available=false` geçici olarak stokta yok demektir.
      x-scope: cloud_read
      parameters:
      - name: region
        in: query
        schema:
          type: string
          example: eu-de-1
        description: Filter by region (see GET /cloud/locations). A city name (falkenstein) also works.
      - name: plan
        in: query
        schema:
          type: string
          example: standart-2-4
        description: Filter by plan name
      - name: location
        in: query
        deprecated: true
        schema:
          type: string
        description: Deprecated alias of region (legacy location code)
      - name: server_type
        in: query
        deprecated: true
        schema:
          type: string
        description: Deprecated alias of plan (legacy type code)
      - $ref: '#/components/parameters/Page'
      - name: limit
        in: query
        schema:
          type: integer
          minimum: 1
          maximum: 100
          default: 100
      responses:
        '200':
          description: Products
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Product'
                  meta:
                    $ref: '#/components/schemas/PageMeta'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          $ref: '#/components/responses/Validation'
  /cloud/locations:
    get:
      tags:
      - Catalog
      operationId: listLocations
      summary: List locations with orderable products
      x-summary-tr: Sipariş verilebilen lokasyonları listele
      x-scope: cloud_read
      responses:
        '200':
          description: Locations
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Location'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /cloud/images:
    get:
      tags:
      - Catalog
      operationId: listImages
      summary: List operating system images
      x-summary-tr: İşletim sistemi imajlarını listele
      x-scope: cloud_read
      responses:
        '200':
          description: Images
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Image'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          $ref: '#/components/responses/Validation'
      parameters:
      - name: region
        in: query
        required: false
        schema:
          type: string
          example: tr-ist-1
        description: 'Only images offered in this region (e.g. tr-ist-1). Without it: the images of the global cloud catalogue (unchanged).'
        x-description-tr: Yalnız bu bölgede sunulan imajlar (ör. tr-ist-1). Verilmezse küresel bulut kataloğunun imajları (değişmedi).
      - name: product_id
        in: query
        required: false
        schema:
          type: integer
        description: Only the images offered on this product (implies its region).
        x-description-tr: Yalnız bu üründe sunulan imajlar (ürünün bölgesini de seçer).
      - name: plan
        in: query
        required: false
        schema:
          type: string
          example: standart-2-4
        description: 'With region: only the images of this plan in that region.'
        x-description-tr: 'region ile: bu bölgedeki bu planın imajları.'
  /cloud/ssh-keys:
    get:
      tags:
      - SSH keys
      operationId: listSshKeys
      summary: List SSH keys
      x-summary-tr: SSH anahtarlarını listele
      x-scope: cloud_read
      parameters:
      - $ref: '#/components/parameters/Page'
      - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: SSH keys
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/SshKey'
                  meta:
                    $ref: '#/components/schemas/PageMeta'
        '401':
          $ref: '#/components/responses/Unauthorized'
    post:
      tags:
      - SSH keys
      operationId: createSshKey
      summary: Add an SSH key
      x-summary-tr: SSH anahtarı ekle
      description: Accepts ssh-ed25519, ecdsa-sha2-nistp256/384/521, sk-ssh-ed25519 and ssh-rsa (2048 bit or more). At most 50 keys per account; fingerprints are
        unique per account.
      x-description-tr: ssh-ed25519, ecdsa-sha2-nistp256/384/521, sk-ssh-ed25519 ve ssh-rsa (en az 2048 bit) kabul edilir. Hesap başına en fazla 50 anahtar; parmak
        izi hesapta benzersizdir.
      x-scope: cloud_write
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - name
              - public_key
              properties:
                name:
                  type: string
                  minLength: 1
                  maxLength: 64
                  example: laptop
                public_key:
                  type: string
                  example: ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIFaA... me@laptop
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/SshKey'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/Validation'
  /cloud/ssh-keys/{id}:
    parameters:
    - name: id
      in: path
      required: true
      schema:
        type: integer
    get:
      tags:
      - SSH keys
      operationId: getSshKey
      summary: Get an SSH key
      x-summary-tr: SSH anahtarını getir
      x-scope: cloud_read
      responses:
        '200':
          description: SSH key
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/SshKey'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      tags:
      - SSH keys
      operationId: deleteSshKey
      summary: Delete an SSH key
      x-summary-tr: SSH anahtarını sil
      description: Removes the key from your account. Servers that already have it keep it.
      x-description-tr: Anahtarı hesabınızdan siler. Anahtarın kurulu olduğu sunucularda anahtar kalır.
      x-scope: cloud_write
      responses:
        '200':
          description: Deleted
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      deleted:
                        type: boolean
                      id:
                        type: integer
        '404':
          $ref: '#/components/responses/NotFound'
  /cloud/servers:
    get:
      tags:
      - Servers
      operationId: listServers
      summary: List cloud servers
      x-summary-tr: Bulut sunucuları listele
      x-scope: cloud_read
      parameters:
      - name: status
        in: query
        schema:
          type: string
          enum:
          - active
          - waiting
          - inprocess
          - suspended
          - cancelled
      - $ref: '#/components/parameters/Page'
      - name: limit
        in: query
        schema:
          type: integer
          minimum: 1
          maximum: 100
          default: 25
      responses:
        '200':
          description: Servers (without live state)
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Server'
                  meta:
                    $ref: '#/components/schemas/PageMeta'
        '401':
          $ref: '#/components/responses/Unauthorized'
    post:
      tags:
      - Servers
      operationId: createServer
      summary: Create (order) a cloud server
      x-summary-tr: Bulut sunucu oluştur (sipariş)
      description: "Places an order and pays it **from your account balance** (never from a stored card).\nSafety rules:\n* send `\"dry_run\": true` first to get\
        \ a price quote; nothing is created;\n* a real order needs `\"confirm\": true` **and** an `Idempotency-Key` header — retrying with the\n  same key and body\
        \ returns the first answer (`Idempotency-Replayed: true`) instead of a second order;\n* the operator may cap the number of servers per account (`409 server_limit`).\n\
        Provisioning is asynchronous (typically under a minute): poll `GET /cloud/servers/{id}` until\n`status` is `active` and `live.power_state` is `running`.\n\
        \n**Prepaid products** (`billing: prepaid`, e.g. tr-ist-1): `cycle` is ignored; the order total is 0 and usage is charged hourly from the balance (at most\
        \ the monthly price per month). The balance must cover the first 24 hours, otherwise 422 with the amount to top up (GET /cloud/billing/topup-url). During\
        \ the first 7 days a new account may run at most 5 prepaid servers and 1 container environment (raised by a support ticket; see GET /cloud/account/limits).\
        \ Over the limit: 422 `limit_exceeded` with `details.how_to_increase`; a `dry_run` quote shows the same as `quote.limit_exceeded`.\n\n**Batch (2.21.0):**\
        \ `quantity` creates N servers in one order (one invoice), each a separate service; `name` (with `{n}`) and `tags` label them. `app` installs a one-click\
        \ app on each."
