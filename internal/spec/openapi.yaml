      summary: Set environment variables
      x-summary-tr: Ortam değişkenlerini ayarla
      x-scope: services_write
      description: '`set` merges variables (`{"KEY": "value"}` or KEY=VALUE lines), `unset` removes names, `replace: 1` replaces the whole set. Creates a revision
        and restarts the service. Only `set`, `unset` and `replace` are accepted: an unknown field (e.g. `env`) or a body that changes nothing (no `set`, no `unset`,
        no `replace: 1`) is rejected with **422 `invalid_env`** (`details.expected` lists the fields); nothing is saved and the service does not restart.'
      x-description-tr: '`set` değişken ekler/günceller (`{"KEY":"değer"}` ya da KEY=VALUE satırları), `unset` siler, `replace: 1` tümünü değiştirir. Sürüm oluşturur,
        servis yeniden başlar. Yalnız `set`, `unset` ve `replace` kabul edilir: bilinmeyen alan (ör. `env`) ya da hiçbir şeyi değiştirmeyen gövde (`set`, `unset`,
        `replace: 1` yok) **422 `invalid_env`** ile reddedilir (`details.expected` beklenen alanları verir); hiçbir şey kaydedilmez, servis yeniden başlamaz.'
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
        description: Service id
      - name: name
        in: path
        required: true
        schema:
          type: string
        description: Service name
      responses:
