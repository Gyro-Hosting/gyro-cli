        tags:
          type: string
          example: v*
        auto:
          type: boolean
        repo_file:
          type: boolean
        dockerfile:
          type: string
        context:
          type: string
        image:
          type: string
          example: web
        targets:
          type: array
          items:
            type: string
        approval:
          type: boolean
        auto_rollback:
          type: boolean
        build_image:
          type: string
        commands:
          type: array
          items:
            type: string
        build_env:
          type: object
          additionalProperties:
            type: string
        build_args:
          type: object
          additionalProperties:
            type: string
        cpu_m:
          type: integer
        memory_mi:
          type: integer
        timeout_min:
          type: integer
        verify_min:
          type: integer
        notify:
          type: object
          additionalProperties:
            type: boolean
        webhook_url:
          type: string
          example: https://ecs-api.ist.gyrohosting.com/hook/ab12cd/p1a2b3c4d
        has_token:
          type: boolean
        secret_names:
          type: array
          items:
            type: string
        registry_image:
          type: string
          example: registry.ist.gyrohosting.com/ab12cd/web
