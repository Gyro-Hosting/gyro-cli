        rescue_enabled:
          type: boolean
        backups_enabled:
          type: boolean
        ipv4:
          type:
          - string
          - 'null'
        ipv6_network:
          type:
          - string
          - 'null'
        cores:
          type: integer
        memory_gb:
          type: number
        disk_gb:
          type: integer
        image:
          type:
          - string
          - 'null'
