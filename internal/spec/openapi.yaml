    FirewallRuleInput:
      type: object
      description: 'One firewall rule. New schema (v2.8, network firewall add-on): action, protocol, source, destination, port, priority, direction, description.
        Legacy fields (protocol tcp|udp|icmp + port + source_ips) are still accepted.'
      properties:
        priority:
          type: integer
          minimum: 1
          description: Position (1 = evaluated first). Default = last. First matching rule wins.
        direction:
          type: string
          enum:
          - in
          - out
          default: in
          description: in = inbound to the server, out = new outbound connections (network firewall only)
        action:
          type: string
          enum:
          - allow
          - deny
          default: allow
        protocol:
          type: string
          enum:
          - tcp
          - udp
          - tcp_udp
          - icmp
          - all
          default: tcp
        source:
          type: string
          description: 'any | IPv4/CIDR list (comma separated, max 10). For direction out: the remote address. Country sources (country:XX / not-country:XX) are accepted
            only when capabilities.country_filter is true (currently not offered).'
          example: 203.0.113.0/24
        destination:
          type: string
          description: any (all IPs of the server) or one IP address of the server
          default: any
        port:
          type: string
          description: any | 22 | 80,443 | 1000-2000 (not for icmp/all)
          example: '22'
        description:
          type: string
          maxLength: 60
        source_ips:
          type: array
          items:
            type: string
          maxItems: 20
          description: Legacy - CIDRs (use source)
        permanent:
          type: boolean
          description: Network firewall - skip the 5 minute trial and make the change permanent at once
        confirm_warnings:
          type: boolean
          description: Apply even when the change has warnings (lock-out risk, shadowed or duplicate rules, private sources)
    FirewallPolicy:
      type: object
      description: Network firewall of a server (AWS network ACL / ufw model). Rules are evaluated top to bottom, the first match wins; default_action applies to
        inbound traffic that matches no rule.
      properties:
        server_id:
          type: integer
        engine:
          type: string
          enum:
          - network
          - cloud
          description: network = Istanbul core network (allow + deny, inbound + outbound, stateless - see capabilities); cloud = provider firewall (allow rules only,
            default deny, inbound only)
        default_action:
          type: string
          enum:
          - allow
          - deny
        ping:
          type: boolean
        status:
          type: string
          enum:
          - none
          - applying
          - trial
          - active
          - open
          - removing
        permanent:
          type: boolean
        trial_seconds_left:
          type: integer
        busy:
          type: boolean
        locked:
          type: boolean
          description: Settings locked by Gyro support
        rules:
          type: array
          items:
            $ref: '#/components/schemas/FirewallRule'
        operator_rules:
          type: array
          description: Rules applied by Gyro (read only, evaluated before yours)
          items:
            $ref: '#/components/schemas/FirewallRule'
        corrections:
          type: array
          items:
            type: string
          description: Network addresses corrected on save (e.g. 10.1.2.3/24 -> 10.1.2.0/24)
        capabilities:
          $ref: '#/components/schemas/FirewallCapabilities'
    FirewallCapabilities:
      type: object
      description: Features of the firewall platform behind this server. A request that uses a feature marked false is rejected with 422 err_feature_off.
      properties:
        backend:
          type: string
          enum:
          - stateful
          - stateless
          - cloud
          description: 'stateless = hardware ACL at the network edge: with default_action deny, replies to connections the server opened are let through automatically
            (TCP replies, UDP from port 53/123, UDP to udp_return_ports, ICMP replies).'
        country_filter:
          type: boolean
        brute_force:
          type: boolean
        port_scan:
          type: boolean
        rate_limit:
          type: boolean
        outbound_rules:
          type: boolean
        security_groups:
          type: boolean
        trial:
          type: boolean
        counters:
          type: boolean
        udp_return_ports:
          type: string
          nullable: true
          example: 32768-65535
    FirewallPolicyInput:
      type: object
      required:
      - rules
      properties:
        default_action:
          type: string
          enum:
          - allow
          - deny
          default: allow
        ping:
          type: boolean
          default: true
        rules:
          type: array
          maxItems: 70
          items:
            $ref: '#/components/schemas/FirewallRuleInput'
        permanent:
          type: boolean
          description: Skip the 5 minute trial (otherwise call POST /firewall/policy/confirm within 5 minutes or the change is reverted)
        confirm_warnings:
          type: boolean
