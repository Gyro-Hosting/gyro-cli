        content:
          application/json:
            schema:
              type: object
              properties:
                bucket:
                  type: string
                  description: Bucket name (3-58, lowercase letters, digits, -)
                  x-description-tr: Kova adı (3-58, küçük harf, rakam, -)
                object_lock:
                  type: boolean
                  description: 'Protected Storage only: create with object lock (WORM). Cannot be changed later'
                  x-description-tr: 'Yalnız Korumalı Depolama: nesne kilitli (WORM) aç. Sonradan değiştirilemez'
