      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - storage_service_id
              - bucket
              properties:
                storage_service_id:
                  type: integer
                  description: your active Object Storage service
                bucket:
                  type: string
                  description: bucket name in that service
                  example: backups
                mount_point:
                  type: string
                  description: absolute path under /mnt, /srv, /data, /media, /opt, /home or /var/www; default /mnt/<bucket>. Must be empty or missing on the server.
