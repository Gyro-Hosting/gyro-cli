        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/Validation'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                rules:
                  allOf:
                  - type: array
                    maxItems: 100
                    items:
                      $ref: '#/components/schemas/StorageCorsRule'
                  description: CORS rules as a JSON array
                  x-description-tr: CORS kuralları (JSON dizi)
                cors_json:
