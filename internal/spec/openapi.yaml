        scanned_at:
          type:
          - string
          - 'null'
    StorageObjectLockSummary:
      type: object
      properties:
        service_id:
          type: integer
        product:
          type: string
          enum:
          - protected_storage
        versioning:
          type: boolean
        locked_bucket_rights:
          type: integer
        locked_buckets_used:
          type: integer
        max_retention_days:
          type: integer
        buckets:
          type: array
          items:
            $ref: '#/components/schemas/StorageBucketObjectLock'
        scan:
          oneOf:
          - $ref: '#/components/schemas/StorageLockScan'
          - type: 'null'
    StorageObjectRetention:
      type: object
      properties:
        bucket:
          type: string
        key:
          type: string
        version_id:
          type: string
        size:
          type: integer
        mode:
          type:
          - string
          - 'null'
          enum:
          - GOVERNANCE
          - COMPLIANCE
          - null
        retain_until:
          type:
          - string
          - 'null'
          format: date-time
        retention_active:
          type: boolean
        legal_hold:
          type: boolean
    StorageNoncurrentExpiration:
      type: object
      properties:
        bucket:
          type: string
        noncurrent_days:
          type:
          - integer
          - 'null'
        enabled:
          type: boolean
        default_days:
          type: integer
    Template:
      type: object
      properties:
        id:
          type: integer
        image:
          type: string
          description: 'Image slug to use for installs: custom:<id>'
        name:
          type: string
        description:
          type: string
        status:
          type: string
          enum:
          - creating
          - ready
          - error
          - deleting
          - suspended
          description: suspended = template storage suspended (balance)
        size_gb:
          type: number
          description: Space the template really uses (GB, billed)
        size_bytes:
          type: integer
        min_disk_gb:
          type: integer
          description: Smallest disk a server from this template can have
        base_image:
          type: string
        base_image_name:
          type: string
        source_server_id:
          type:
          - integer
          - 'null'
        region:
          type: string
        mode:
          type: string
          enum:
          - snapshot
          - shutdown
          description: How the template was copied
        warnings:
          type: array
          items:
            type: string
          description: crash_consistent | extra_disks_excluded
        created_at:
          type:
          - string
          - 'null'
          format: date-time
        ready_at:
          type:
          - string
          - 'null'
          format: date-time
        pricing:
          type: object
          properties:
            billing:
              type: string
            per_gb_monthly_eur:
              type: number
            monthly_eur:
              type: number
            hourly_eur:
              type: number
    ServerIps:
      type: object
      properties:
        server_id:
          type: integer
        primary_ip:
          type:
          - string
          - 'null'
        extra_ips:
          type: array
          items:
            type: object
            properties:
              ip:
                type: string
              prefix:
                type: integer
                description: always 32 (configured as /32 on the primary interface)
              added_at:
                type:
                - string
                - 'null'
              reverse_dns:
                type:
                - string
                - 'null'
        count:
          type: integer
        max:
          type: integer
          description: per-server limit (default 5)
        available:
          type: integer
        applied_on_server:
          type: boolean
          description: false = the server's guest agent did not confirm yet (see manual_commands)
        pending:
          type: boolean
          description: true while the address list is being applied on the server (a few seconds)
        manual_commands:
          type: array
          items:
            type: string
        pricing:
          type: object
          properties:
            billing:
              type: string
            per_ip_monthly_eur:
              type: number
            per_ip_hourly_eur:
              type: number
            per_ip_monthly_text:
              type:
              - string
              - 'null'
              description: TL (EUR) at the panel rate
            minimum_hours:
              type: integer
              description: every added address is billed at least this many hours (default 6), even if released earlier; taking an address again starts a new minimum
        added:
          type: array
          items:
            type: string
        released:
          type: string
        adds_per_hour:
          type:
          - integer
          - 'null'
          description: addresses that can be added to this server per rolling 60 minutes (default 10)
        adds_left_this_hour:
          type:
          - integer
          - 'null'
