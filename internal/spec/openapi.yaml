    SecurityGroupRule:
      type: object
      required:
      - type
      description: 'Allow rule (security groups never deny; stateful: replies pass automatically).'
      x-description-tr: İzin kuralı (güvenlik grupları engellemez; bağlantı durumu izlenir, yanıtlar kendiliğinden geçer).
      properties:
        id:
          type: string
          pattern: ^gfr-[a-f0-9]{8}$
          description: Rule id (keep it when you edit a rule; omit for a new rule)
        direction:
          type: string
          enum:
          - in
          - out
          default: in
          description: in = to your servers; out = new connections from your servers (network servers only)
        type:
          type: string
          enum:
          - ssh
          - http
          - https
          - rdp
          - mysql
          - postgresql
          - mssql
          - redis
          - mongodb
          - smtp
          - smtps
          - imaps
          - dns_udp
          - dns_tcp
          - all_tcp
          - all_udp
          - all_icmp
          - all
          - custom_tcp
          - custom_udp
          description: Fixes protocol and port; custom_tcp / custom_udp take `port`
        protocol:
          type: string
          readOnly: true
          enum:
          - tcp
          - udp
          - icmp
          - all
        port:
          type: string
          description: 'For custom_tcp / custom_udp: 8080 or 8000-8100. Read: the port of the type, `all` for all ports'
          example: '8080'
        source:
          type: array
          items:
            type: string
          maxItems: 50
          description: 'IPv4 / CIDR list; ["0.0.0.0/0"] = anywhere. For out: the remote address'
          example:
          - 203.0.113.10/32
        description:
          type: string
          maxLength: 60
