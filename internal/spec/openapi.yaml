openapi: 3.1.0
info:
  title: Gyro Public API
  version: 2.17.1
  summary: Manage Gyro cloud servers, SSH keys and billing programmatically.
  x-summary-tr: Gyro bulut sunucularınızı, SSH anahtarlarınızı ve faturalarınızı programla yönetin.
  description: "The Gyro Public API lets you automate everything you do in the Gyro client area:\norder and manage cloud servers, keep SSH keys, read invoices and\
    \ your account balance.\nIt is the API behind the official Terraform provider (`gyro-hosting/gyro`) and `gyroctl`.\n\n* **Base URL** `https://www.gyrohosting.com/api/v1/client`\n\
    * **Authentication** `Authorization: Bearer wck_...` (create keys in *Client area → account menu (top right) → API Credentials*)\n* **Format** JSON in, JSON out.\
    \ Successful answers are `{\"data\": ..., \"meta\": ...}`; errors are\n  `{\"error\": {\"code\", \"message\", \"details\"}}`.\n\n**v2**: every product line through\
    \ the generic service bridge (`/cloud/services`), webhooks, sub-account keys, reseller (bayi) end-customers, and the complete core client API (domains, DNS, tickets,\
    \ orders, invoices, account) under the same key.\n\n**2.10.0**: region `tr-ist-1` (Gyro Cloud Istanbul) on the same `/cloud/servers` endpoints, CLI commands and\
    \ Terraform resources; `GET /cloud/images?region=`; SSH keys installed after first boot in tr-ist-1 (`ssh_keys` on the server).\n\n**2.11.0**: prepaid hourly\
    \ billing from the account balance for Gyro Containers (ECS) and Gyro Cloud Istanbul (`billing: prepaid` on products and servers; `/cloud/billing/balance|usage|statement/{month}|estimate|topup-url`);\
    \ `/cloud/containers` (Gyro Containers).\n\n**2.13.0 (pre-sale)**: plan change for prepaid services through `/cloud/services/{id}/resize` (no invoice, `plan`\
    \ name accepted); tr-ist-1 reverse DNS create on new addresses + `status`; prepaid snapshot pricing on `/cloud/servers/{id}/snapshots`.\n\n**2.13.1**: Protected\
    \ Storage (versioning + object lock / WORM): `object_lock` on bucket create, versions list / restore / undelete / delete, bucket default retention, per-version\
    \ retention and legal hold, old version expiry, lock summary and scan. Standard Object Storage answers 409 `feature_not_available` on these.\n\n**2.14.0**: tr-ist-1\
    \ servers on Gyro Compute: SSH keys (up to 10) and `user_data` at creation through cloud-init (~25 s to SSH), `reset` action, rebuild with `user_data`, real snapshot\
    \ ids, metrics (instant), browser console URL. Request / response shapes unchanged.\n\n**2.15.0**: custom templates for tr-ist-1 servers: capture a server (`POST\
    \ /cloud/servers/{id}/templates`), list / rename / delete, new server (`POST /cloud/templates/{id}/servers`) or reinstall (`POST /cloud/templates/{id}/rebuild`)\
    \ from it. 0.05 EUR per GB-month (prepaid, hourly). No image upload.\n\n**2.16.0**: additional IPv4 addresses for tr-ist-1 servers: `GET/POST /cloud/servers/{id}/ips`,\
    \ `DELETE /cloud/servers/{id}/ips/{ip}` (hourly from the prepaid balance, default 2 EUR per address-month, up to 5 per server; configured on the server automatically).\n\
    \n**2.16.1**: `GET /cloud/apps` returns `min_ram_gb` (fixed), `min_disk_gb`, `min_cpu`, `popular_tr`, `version`, `license` and `description` for each one-click\
    \ app. Additive change.\n\n**2.17.0**: Gyro Containers: per-service autoscaling (`PUT /cloud/containers/{id}/services/{name}/autoscaling`, also `autoscaling`\
    \ / `alerts` on create and update), notification channels (`GET/PUT /cloud/containers/{id}/notifications`, `.../notifications/test`, `.../notifications/webhook-secret`:\
    \ e-mail, SMS, Telegram, signed webhook). Additive.\n\n**2.17.1**: additional IPv4: each added address is billed at least 6 hours (`pricing.minimum_hours`), per-server\
    \ add limit per hour (`adds_per_hour`, `adds_left_this_hour`). Additive.\n"
  x-description-tr: "Gyro Public API, müşteri panelinde yaptığınız her işi otomatikleştirmenizi sağlar:\nbulut sunucu siparişi ve yönetimi, SSH anahtarları, fatura\
    \ ve bakiye okuma.\nResmi Terraform sağlayıcısı (`gyro-hosting/gyro`) ve `gyroctl` bu API'yi kullanır.\n\n* **Taban adres** `https://www.gyrohosting.com/api/v1/client`\n\
    * **Kimlik** `Authorization: Bearer wck_...` (anahtarı *Müşteri paneli → sağ üstteki hesap menüsü → API Kimlik Bilgileri* bölümünden oluşturun)\n* **Biçim** JSON\
    \ gönderilir, JSON döner. Başarılı yanıt `{\"data\": ..., \"meta\": ...}`, hata\n  `{\"error\": {\"code\", \"message\", \"details\"}}` biçimindedir.\n\n**v2**:\
    \ genel hizmet köprüsüyle tüm ürün hatları (`/cloud/services`), webhook'lar, alt hesap anahtarları, bayi uç-müşterileri ve aynı anahtarla çekirdek müşteri API'sinin\
    \ tamamı (alan adı, DNS, destek, sipariş, fatura, hesap).\n\n**2.10.0**: aynı `/cloud/servers` uçları, CLI komutları ve Terraform kaynaklarıyla `tr-ist-1` bölgesi\
    \ (Gyro Bulut İstanbul); `GET /cloud/images?region=`; tr-ist-1'de SSH anahtarları ilk açılıştan sonra yüklenir (sunucuda `ssh_keys`).\n\n**2.11.0**: Gyro Kapsayıcı\
    \ (ECS) ve Gyro Bulut İstanbul için bakiyeden saatlik ön ödemeli faturalama (ürün ve sunucularda `billing: prepaid`; `/cloud/billing/balance|usage|statement/{month}|estimate|topup-url`);\
    \ `/cloud/containers` (Gyro Kapsayıcı).\n\n**2.13.0 (satış öncesi)**: ön ödemeli hizmetlerde `/cloud/services/{id}/resize` ile plan değişikliği (fatura yok, `plan`\
    \ adı kabul edilir); tr-ist-1'de yeni IP'de ters DNS oluşturma + `status`; ön ödemeli snapshot fiyatı.\n\n**2.13.1**: Korumalı Depolama (sürümleme + nesne kilidi\
    \ / WORM): kova açılışında `object_lock`, sürüm listele / geri yükle / silme işaretini kaldır / kalıcı sil, kova varsayılan saklaması, sürüm başına saklama ve\
    \ legal hold, eski sürüm silme süresi, kilit özeti ve tarama. Standart Nesne Depolama bu uçlarda 409 `feature_not_available` döner.\n\n**2.14.0**: tr-ist-1 sunucuları\
    \ Gyro Compute üzerinde: oluşturmada cloud-init ile SSH anahtarları (en çok 10) ve `user_data` (SSH'a ~25 sn), `reset` eylemi, `user_data` ile yeniden kurulum,\
    \ gerçek snapshot numaraları, anlık metrikler, tarayıcı konsolu adresi. İstek / yanıt biçimleri değişmedi.\n\n**2.15.0**: tr-ist-1 sunucuları için özel şablonlar:\
    \ sunucudan şablon (`POST /cloud/servers/{id}/templates`), listele / adlandır / sil, şablondan yeni sunucu (`POST /cloud/templates/{id}/servers`) ya da yeniden\
    \ kurulum (`POST /cloud/templates/{id}/rebuild`). GB başına aylık 0,05 € (ön ödemeli, saatlik). Dışarıdan imaj yüklenmez.\n\n**2.16.0**: tr-ist-1 sunucularına\
    \ ek IPv4: `GET/POST /cloud/servers/{id}/ips`, `DELETE /cloud/servers/{id}/ips/{ip}` (ön ödemeli bakiyeden saatlik, varsayılan adres başına aylık 2 €, sunucu\
    \ başına en çok 5; sunucuya otomatik tanımlanır).\n\n**2.16.1**: `GET /cloud/apps` her tek tık uygulama için `min_ram_gb` (düzeltildi), `min_disk_gb`, `min_cpu`,\
    \ `popular_tr` (Türkiye'de popüler), `version`, `license` ve `description` döndürür. Geriye uyumlu ekleme.\n\n**2.17.0**: Gyro Kapsayıcı: servis başına otomatik\
    \ ölçekleme (`PUT /cloud/containers/{id}/services/{name}/autoscaling`, oluştur/güncellemede `autoscaling` / `alerts`), bildirim kanalları (`GET/PUT /cloud/containers/{id}/notifications`,\
    \ `.../notifications/test`, `.../notifications/webhook-secret`: e-posta, SMS, Telegram, imzalı webhook). Geriye uyumlu.\n\n**2.17.1**: ek IPv4: her eklenen adres\
    \ en az 6 saat ücretlendirilir (`pricing.minimum_hours`), sunucu başına saatlik ekleme sınırı (`adds_per_hour`, `adds_left_this_hour`). Geriye uyumlu.\n"
  contact:
    name: Gyro Hosting
    url: https://www.gyrohosting.com
  license:
    name: Proprietary
    identifier: LicenseRef-Gyro-API-Terms
servers:
- url: https://www.gyrohosting.com/api/v1/client
  description: Production
security:
- bearerAuth: []
tags:
- name: Servers
  description: Cloud servers you own. Creating one places an order paid from your account balance.
  x-description-tr: Sahip olduğunuz bulut sunucular. Oluşturma, hesap bakiyesinden ödenen bir sipariştir.
- name: Server actions
  description: Power, rebuild, password and rescue operations. Asynchronous; poll the server until `live.locked` is false.
  x-description-tr: Güç, yeniden kurulum, parola ve kurtarma işlemleri. Eşzamansızdır; `live.locked` false olana kadar sunucuyu sorgulayın.
- name: Snapshots and backups
  description: Point-in-time images of a server disk. Snapshot space is an add-on quota in GB.
  x-description-tr: Sunucu diskinin anlık görüntüleri. Snapshot alanı GB cinsinden ek hizmet kotasıdır.
- name: Networking
  description: Reverse DNS and the inbound firewall of a server.
  x-description-tr: Sunucunun ters DNS kayıtları ve gelen trafik güvenlik duvarı.
- name: Monitoring
  description: CPU, disk and network metrics and the provider-side action history.
  x-description-tr: CPU, disk ve ağ ölçümleri ile sunucu işlem geçmişi.
- name: SSH keys
  description: Account-level public keys you can install on new servers.
  x-description-tr: Yeni sunuculara kurulabilen, hesap düzeyinde açık anahtarlar.
- name: Catalog
  description: Orderable products, locations and operating system images.
  x-description-tr: Sipariş verilebilen ürünler, lokasyonlar ve işletim sistemi imajları.
- name: Billing
  description: Invoices and account balance (read-only with the recommended scopes).
  x-description-tr: Faturalar ve hesap bakiyesi (önerilen kapsamlarla salt okunur).
- name: Account
  description: Key introspection and the write log of your API keys.
  x-description-tr: Anahtar bilgisi ve API anahtarlarınızın yazma kaydı.
- name: Services (all products)
  description: 'Generic bridge to every product line (cloud server, VDS, dedicated, mail, monitor, storage, license, ...).

    Everything a customer can do on a service in the client area is a module tool or method and is reachable here.

    Start with `GET /cloud/services/{id}/tools`: it lists the tools, their actions and our safety policy

    (`read`, `confirm`, `secret`) for that very service.

    '
  x-description-tr: 'Tüm ürün hatlarına (bulut sunucu, VDS, fiziksel sunucu, kurumsal mail, izleme, depolama, lisans, ...) genel köprü.

    Müşteri panelinde bir hizmette yapılabilen her şey bir modül aracı ya da metodudur ve burada erişilebilir.

    `GET /cloud/services/{id}/tools` ile başlayın: o hizmetin araçlarını, eylemlerini ve güvenlik politikasını

    (`read`, `confirm`, `secret`) döndürür.

    '
- name: Webhooks
  description: Signed HTTPS callbacks for service, invoice, order and ticket events.
  x-description-tr: Hizmet, fatura, sipariş ve talep olayları için imzalı HTTPS geri çağrıları.
- name: API keys
  description: Sub-account keys narrowed to services, actions or a reseller end-customer. Only GyroAPI `/cloud` routes accept them.
  x-description-tr: Hizmet, eylem ya da bayi uç-müşterisiyle daraltılmış alt hesap anahtarları. Yalnız GyroAPI `/cloud` uçlarında geçerlidir.
- name: Reseller
  description: Reseller (bayi) accounts manage their own end-customers, assign services, mint end-customer keys and read usage reports. Services stay on the reseller
    account and use its discount.
  x-description-tr: Bayi hesapları kendi uç-müşterilerini yönetir, hizmet atar, uç-müşteri anahtarı üretir ve kullanım raporu okur. Hizmetler bayinin hesabında kalır
    ve bayi indirimiyle fiyatlanır.
- name: Mail
  description: Typed corporate-mail shortcuts (mailboxes, aliases, catch-all, auto-responders, IMAP migrations, DNS, spam, delivery log, quarantine, deleted mail,
    archive, 2FA). Mailboxes are addressed by local part.
  x-description-tr: Kurumsal mail kısayolları (kutular, takma adlar, catch-all, otomatik yanıt, IMAP taşıma, DNS, spam, teslim kaydı, karantina, silinen posta, arşiv,
    2FA). Kutular yerel kısımla (@ öncesi) adreslenir.
- name: Object storage
  description: 'Typed S3 storage shortcuts: buckets, access keys (secret shown once), usage, connection details.'
  x-description-tr: 'S3 depolama kısayolları: kovalar, erişim anahtarları (gizli bir kez), kullanım, bağlantı bilgisi.'
- name: Monitoring (uptime)
  description: 'Typed uptime-monitor shortcuts: monitors, channels, heartbeats, status pages.'
  x-description-tr: 'Uptime izleme kısayolları: monitörler, kanallar, heartbeat, durum sayfaları.'
- name: Licenses
  description: Software license status and IP change.
  x-description-tr: Yazılım lisansı durumu ve IP değişikliği.
- name: One-click apps
  description: Install a one-click app on a cloud server (the disk is rebuilt).
  x-description-tr: Bulut sunucuya tek tık uygulama kur (disk yeniden kurulur).
- name: Plan changes and add-ons
  description: 'Resize (plan upgrade) and add-on purchase, paid from the account balance (dry_run, confirm, Idempotency-Key, daily limit: default 50 paid operations
    per account, per-account/reseller override, 429 daily_limit).'
  x-description-tr: 'Paket yükseltme ve ek hizmet satın alma; bakiyeden ödenir (dry_run, confirm, Idempotency-Key, günlük sınır: hesap başına varsayılan 50 ücretli
    işlem, hesap/bayi bazında istisna, 429 daily_limit).'
- name: Panel users
  description: 'Sub-users: extra panel logins with limited permissions (accountant, technical staff). Scope `users`.'
  x-description-tr: 'Alt kullanıcılar: sınırlı izinli ek panel girişleri (muhasebe, teknik ekip). Kapsam `users`.'
- name: Load balancers
  description: 'Managed L4/L7 load balancer for your cloud servers: services, health checks, targets, free Let''s Encrypt certificates, metrics. EU regions.'
  x-description-tr: 'Bulut sunucularınız için yönetilen L4/L7 yük dengeleyici: servisler, sağlık kontrolü, hedefler, ücretsiz Let''s Encrypt sertifikası, ölçümler.
    AB bölgeleri.'
- name: Containers
  description: 'Gyro Containers (ECS), Istanbul tr-ist-1: run Docker images on a node pool dedicated to you (no other customer''s containers on your nodes). Services
    with zero-downtime deploys, revision history and rollback, scaling, environment variables and encrypted secrets, HTTPS address <name>-<code>.gyroapp.net plus
    your own domains (free certificates), logs and metrics. Order the environment like any product (`/cloud/services` lists it); manage it here.'
  x-description-tr: 'Gyro Kapsayıcı (ECS), İstanbul tr-ist-1: Docker imajlarını size ayrılmış düğüm havuzunda çalıştırın. Kesintisiz dağıtım, sürüm geçmişi ve geri
    alma, ölçekleme, ortam değişkenleri ve şifreli gizli değerler, <ad>-<kod>.gyroapp.net HTTPS adresi ve kendi alan adlarınız (ücretsiz sertifika), loglar ve grafikler.'
- name: Managed DNS
  description: 'Authoritative DNS on ns1.gyrodns.net (Istanbul) + ns2.gyrodns.net (Germany): zones, records (A/AAAA/CNAME/MX/TXT/SRV/CAA/ALIAS/NS/PTR), BIND import/export,
    one-click DNSSEC, health-checked failover records.'
  x-description-tr: 'ns1.gyrodns.net (İstanbul) + ns2.gyrodns.net (Almanya) yetkili DNS: zone''lar, kayıtlar, BIND içe/dışa aktarma, tek tık DNSSEC, sağlık kontrollü
    failover kayıtları.'
- name: Security groups
  description: 'Reusable allow lists (AWS security group model) for servers with the network firewall add-on. Up to 5 groups per server, evaluated after Gyro rules
    and your advanced ordered rules; with groups and no advanced rules inbound traffic is denied by default. Rules count against the server''s rule allowance. A change
    that could cut SSH/RDP access runs as a 5 minute trial: confirm it.'
  x-description-tr: 'Ağ güvenlik duvarı ek hizmeti olan sunucular için yeniden kullanılabilir izin listeleri (AWS security group modeli). Sunucu başına en çok 5 grup;
    Gyro kuralları ve gelişmiş sıralı kurallarınızdan sonra değerlendirilir; grup olup gelişmiş kural yoksa gelen trafik varsayılan olarak kapalıdır. Kurallar sunucunun
    kural hakkından düşer. SSH/RDP erişimini kesebilecek değişiklik 5 dakikalık deneme olarak uygulanır: onaylayın.'
- name: Reference data
  description: Countries, states, cities.
  x-description-tr: Ülke, il, ilçe.
- name: Services (core)
  description: 'Core service endpoints: renew, cancel, auto-renew, add-ons, metrics, SSO, password.'
  x-description-tr: 'Çekirdek hizmet uçları: yenileme, iptal, otomatik yenileme, ek hizmetler, ölçümler, SSO, parola.'
- name: Domains and DNS
  description: Register, transfer, renew, nameservers, DNS records, DNSSEC, lock, EPP code, privacy, WHOIS contacts, forwarding (core WISECP client API).
  x-description-tr: Kayıt, transfer, yenileme, ad sunucuları, DNS kayıtları, DNSSEC, kilit, EPP kodu, gizlilik, WHOIS kişileri, yönlendirme (çekirdek WISECP müşteri
    API'si).
- name: Orders
  description: Preview (quote) and place orders for any product.
  x-description-tr: Her ürün için teklif ve sipariş.
- name: Support tickets
  description: Departments, open, reply, close, reopen, rate, attachments.
  x-description-tr: Departmanlar, aç, yanıtla, kapat, yeniden aç, puanla, ekler.
- name: SMS
  description: SMS senders, quote and send.
  x-description-tr: SMS başlıkları, teklif ve gönderim.
- name: Affiliate
  description: Affiliate programme.
  x-description-tr: Satış ortaklığı.
- name: Templates
  description: Custom templates from your own tr-ist-1 servers (no image upload)
  x-description-tr: Kendi tr-ist-1 sunucularınızdan özel şablonlar (dışarıdan imaj yüklenmez)
paths:
  /whoami:
    get:
      tags:
      - Account
      operationId: whoami
      summary: Describe the calling API key
      x-summary-tr: Çağıran API anahtarını göster
      x-scope: any
      responses:
        '200':
          description: Key details
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      id:
                        type: integer
                      type:
                        type: string
                        const: client
                      name:
                        type: string
                      permissions:
                        type: array
                        items:
                          type: string
                      owner_id:
                        type: integer
        '401':
          $ref: '#/components/responses/Unauthorized'
  /cloud/activity:
    get:
      tags:
      - Account
      operationId: listActivity
      summary: List write calls made with your API keys
      x-summary-tr: API anahtarlarınızla yapılan yazma çağrılarını listele
      description: Every non-GET call to `/cloud/...` is recorded for 365 days (method, path, scope, HTTP status, IP, key id). Request and response bodies are never
        stored.
      x-description-tr: '`/cloud/...` altındaki her GET dışı çağrı 365 gün saklanır (yöntem, yol, kapsam, HTTP durumu, IP, anahtar no). İstek ve yanıt gövdeleri saklanmaz.'
      x-scope: cloud_read
      parameters:
      - $ref: '#/components/parameters/Page'
      - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Activity page
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/ActivityEntry'
                  meta:
                    $ref: '#/components/schemas/PageMeta'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /cloud/products:
    get:
      tags:
      - Catalog
      operationId: listProducts
      summary: List orderable cloud server products
      x-summary-tr: Sipariş verilebilen bulut sunucu ürünlerini listele
      description: Prices are in the product currency, VAT excluded. `available=false` means temporarily out of stock.
      x-description-tr: Fiyatlar ürün para biriminde ve KDV hariçtir. `available=false` geçici olarak stokta yok demektir.
      x-scope: cloud_read
      parameters:
      - name: region
        in: query
        schema:
          type: string
          example: eu-de-1
        description: Filter by region (see GET /cloud/locations). A city name (falkenstein) also works.
      - name: plan
        in: query
        schema:
          type: string
          example: standart-2-4
        description: Filter by plan name
      - name: location
        in: query
        deprecated: true
        schema:
          type: string
        description: Deprecated alias of region (legacy location code)
      - name: server_type
        in: query
        deprecated: true
        schema:
          type: string
        description: Deprecated alias of plan (legacy type code)
      - $ref: '#/components/parameters/Page'
      - name: limit
        in: query
        schema:
          type: integer
          minimum: 1
          maximum: 100
          default: 100
      responses:
        '200':
          description: Products
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Product'
                  meta:
                    $ref: '#/components/schemas/PageMeta'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          $ref: '#/components/responses/Validation'
  /cloud/locations:
    get:
      tags:
      - Catalog
      operationId: listLocations
      summary: List locations with orderable products
      x-summary-tr: Sipariş verilebilen lokasyonları listele
      x-scope: cloud_read
      responses:
        '200':
          description: Locations
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Location'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /cloud/images:
    get:
      tags:
      - Catalog
      operationId: listImages
      summary: List operating system images
      x-summary-tr: İşletim sistemi imajlarını listele
      x-scope: cloud_read
      responses:
        '200':
          description: Images
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Image'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          $ref: '#/components/responses/Validation'
      parameters:
      - name: region
        in: query
        required: false
        schema:
          type: string
          example: tr-ist-1
        description: 'Only images offered in this region (e.g. tr-ist-1). Without it: the images of the global cloud catalogue (unchanged).'
        x-description-tr: Yalnız bu bölgede sunulan imajlar (ör. tr-ist-1). Verilmezse küresel bulut kataloğunun imajları (değişmedi).
      - name: product_id
        in: query
        required: false
        schema:
          type: integer
        description: Only the images offered on this product (implies its region).
