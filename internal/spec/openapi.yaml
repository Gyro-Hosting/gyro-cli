        \ yaklaşık bir dakikada `cancelled`) - faturalama durur, sunucu hemen kapanır, bekleme süresi (3 gün) sonunda\n  verisiyle silinir. Paneldeki onaylanmış \"\
        hemen iptal\" ile aynı etki. Yönetici kapatabilir.\nTekrar çağırmak güvenlidir.\n"
      x-scope: cloud_delete
