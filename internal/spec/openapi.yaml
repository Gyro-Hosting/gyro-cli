        ssh:
          type: object
          description: SSH repositories only
          properties:
            host:
              type: string
            port:
              type: integer
            user:
              type: string
            pinned:
              type: boolean
              description: 'GitHub / GitLab / Bitbucket: published host keys are pinned'
            host_key_trusted:
              type: boolean
            host_keys:
              type: array
              items:
                type: object
                properties:
                  type:
                    type: string
