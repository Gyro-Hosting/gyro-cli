components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: wck_ + 32 characters
      description: "Client API key. Scopes: `Module:Addons/GyroAPI/cloud_read`, `.../cloud_write`, `.../cloud_order` (spends balance),\n`.../cloud_delete`, plus core\
        \ scopes such as `Invoices/GetInvoices`, `Balance/GetBalance`. Optional IP allow list per key.\nDefault limit 60 requests per minute per key (`X-RateLimit-*`\
        \ headers, `429` with `Retry-After`).\n v2 scopes: `services_read`, `services_write`, `webhooks`, `keys`, `reseller`, `billing_pay`, `billing_read`, `users`\
        \ (all under `Module:Addons/GyroAPI/`)."
  parameters:
    ServerId:
      name: id
      in: path
      required: true
      schema:
        type: integer
      description: Server id (= service id in the client area)
    Page:
      name: page
      in: query
      schema:
        type: integer
        minimum: 1
        default: 1
    Limit:
      name: limit
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 50
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema:
        type: string
        minLength: 8
        maxLength: 191
      description: Unique per logical request (e.g. a UUID). Replays within 24 hours return the stored answer.
  responses:
    BadRequest:
      description: Malformed request (e.g. missing Idempotency-Key)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Unauthorized:
      description: Missing, invalid or revoked key
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    PaymentRequired:
      description: Account balance does not cover the order (`insufficient_balance`)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Forbidden:
      description: Key lacks the scope, IP not allowed, or feature disabled
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    NotFound:
      description: Not found — also returned for objects owned by someone else
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Conflict:
      description: State conflict (`server_locked`, `not_actionable`, `ssh_key_exists`, `server_limit`, `idempotency_in_flight`)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Validation:
      description: Validation or business rule failure (`confirm_required`, `invalid_image`, `tool_action_failed` ...)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
  schemas:
    Error:
      type: object
      required:
      - error
      properties:
        error:
          type: object
          required:
          - code
          - message
          properties:
            code:
              type: string
              example: server_not_found
            message:
              type: string
            details:
              type: object
              additionalProperties: true
    PageMeta:
      type: object
      properties:
        total:
          type: integer
        page:
          type: integer
        limit:
          type: integer
        next_page:
          type: integer
          description: 0 when this is the last page
    Money:
      type: object
      properties:
        amount:
          type: number
        currency:
          type:
          - string
          - 'null'
          example: TRY
    Price:
      type: object
      properties:
        cycle:
          type: string
          example: monthly
        amount:
          type: number
        setup:
          type: number
        currency:
          type: string
    Product:
      type: object
      properties:
        id:
          type: integer
          example: 723
        name:
          type: string
          example: Gyro Bulut Eko 2-4
        server_type:
          type: string
          example: cx23
        location:
          type: string
          example: fsn1
        cores:
          type:
          - integer
          - 'null'
        memory_gb:
          type:
          - number
          - 'null'
        disk_gb:
          type:
          - integer
          - 'null'
        cpu_type:
          type:
          - string
          - 'null'
          enum:
          - shared
          - dedicated
          - null
        architecture:
          type:
          - string
          - 'null'
          example: x86
        traffic_tb:
          type:
          - number
          - 'null'
        ipv4:
          type: boolean
        ipv6:
          type: boolean
        available:
          type: boolean
        prices:
          type: array
          items:
            $ref: '#/components/schemas/Price'
        product_line:
          type: string
          enum:
          - cloud_server
          - vds
          description: cloud_server (global cloud) or vds (Istanbul VDS)
    Location:
      type: object
      properties:
        code:
          type: string
          example: fsn1
        city:
          type: string
          example: Falkenstein
        country:
          type: string
          example: DE
        zone:
          type: string
          example: eu-central
        products:
          type: integer
    Image:
      type: object
      properties:
        slug:
          type: string
          example: debian-12
        name:
          type: string
          example: Debian 12
        os_flavor:
          type: string
          example: debian
    SshKey:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        fingerprint:
          type: string
