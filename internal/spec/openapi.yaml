              state:
                type: string
                enum:
                - pending
                - running
                - failing
                - rolled_back
                - missing
              problem:
                type: string
        build_seconds:
          type: integer
        billed_minutes:
          type: integer
        duration_seconds:
          type: integer
        created:
          type: string
          format: date-time
        started:
          type: string
          format: date-time
        finished:
          type: string
          format: date-time
        deadline:
          type: string
          format: date-time
          description: approval / health wait deadline
        from_run:
          type: string
          description: 'redeploy: source run'
        archive:
          type: string
          description: upload id (archive runs)
        archive_name:
          type: string
        archive_size:
          type: integer
        archive_format:
          type: string
          enum:
          - tar.gz
          - zip
        image_tag:
          type: string
          description: <sha7> for commits, arc-<upload> for archives
    StoragePlan:
      type: object
      properties:
        id:
          type: integer
          description: product id
        plan:
          type: string
          example: standard-1tb
          description: 'plan name for POST /cloud/storage: standard-250gb | standard-1tb | standard-5tb | standard-10tb | protected-250gb | protected-1tb | protected-5tb
            | protected-10tb'
        name:
          type: string
        kind:
          type: string
          enum:
          - standard
          - protected
          description: standard = Object Storage; protected = Protected Storage (versioning always on, object lock with the add-on)
        region:
          type: string
          example: tr-ist-1
        size_gb:
          type: integer
          description: storage quota
        max_buckets:
          type: integer
        max_access_keys:
          type: integer
        max_objects:
          type: integer
        included_traffic_gb_month:
          type: integer
          description: outbound traffic included every calendar month
        versioning:
          type: boolean
        object_lock:
          description: false, or how to get it (add-on)
        available:
          type: boolean
          description: false = not orderable right now (capacity)
        prices:
          type: array
          items:
            type: object
            properties:
              cycle:
                type: string
                enum:
                - monthly
                - quarterly
                - semiannually
                - annually
              amount:
                type: number
              list_amount:
                type:
                - number
                - 'null'
                description: list price before the discount
              currency:
                type: string
                example: EUR
        tax_included:
          type: boolean
          const: false
        addons:
          type: object
          properties:
            extra_traffic:
              type: array
              items:
                type: object
                properties:
                  size:
                    type: string
                    enum:
                    - 1tb
                    - 5tb
                  extra_traffic_gb:
                    type: integer
                  price:
                    type: object
                  billing:
                    type: string
              description: one-time traffic packs, valid until the end of the calendar month of purchase
            object_lock_buckets:
              type:
              - object
              - 'null'
              description: 'protected plans: price per locked bucket per cycle (min 1, max 50)'
    LimitHint:
      type: object
      description: Present in `error.details` of every refusal caused by a limit (and in dry-run quotes as `quote.limit_exceeded`).
      x-description-tr: Sınır kaynaklı her retin `error.details` alanında (ve dry-run teklifinde `quote.limit_exceeded`) bulunur.
      properties:
        limit_exceeded:
          type: boolean
          const: true
        limit_key:
          type:
          - string
          - 'null'
          example: new_account.servers
          description: limit name as listed by GET /cloud/account/limits (null = module limit without a registry name)
        limit:
          type:
          - integer
          - 'null'
          description: current limit
        current:
          type:
          - integer
          - 'null'
          description: current usage
        how_to_increase:
          type: string
          enum:
          - open_support_ticket
          - upgrade_plan
          - wait
          description: open_support_ticket = raised on request; upgrade_plan = a bigger plan or an add-on; wait = short rate limit, retry later
        support_ticket:
          type: object
          description: ready-to-send ticket request (fill in <N> and the reason)
          properties:
            endpoint:
              type: string
              example: POST /api/v1/client/tickets
            body:
              type: object
              properties:
                department_id:
                  type: integer
                subject:
                  type: string
                message:
                  type: string
            cli:
              type: string
              example: 'gyro ticket create --department-id 3 --subject "Limit increase: new_account.servers" --message "..."'
            departments:
              type: string
            scope:
              type: string
              example: Tickets/CreateTicket
        limits_endpoint:
          type: string
          example: GET /api/v1/client/cloud/account/limits
        hint:
          type: string
          example: This limit can be raised with a support ticket.
        hint_tr:
          type: string
          example: Bu sınır destek talebiyle artırılabilir.
        reason:
          type: string
          description: original error code when the code was changed (checkout_blocked -> limit_exceeded)
    AccountLimit:
      type: object
      properties:
        key:
          type: string
          example: compute.max_vms
        group:
          type: string
          example: compute
        scope:
          type: string
          enum:
          - account
          - service
          description: account = one number for the account; service = applies to each service (see `services`)
        limit:
          type:
          - integer
          - 'null'
          description: effective limit (null = depends on the plan of each service, see `services`, or no limit)
        used:
          type:
          - integer
          - 'null'
        unit:
          type: string
        custom:
          type: boolean
          description: raised (or lowered) for your account
        increasable:
          type: boolean
        how_to_increase:
          type: string
          enum:
          - open_support_ticket
          - upgrade_plan_or_open_support_ticket
          - upgrade_plan
          - wait
          - fixed
        description:
          type: string
        description_tr:
          type: string
        max_size:
          type: object
          description: compute.max_server_size only
          properties:
            vcpu:
              type: integer
            memory_gb:
              type: integer
            disk_gb:
              type: integer
        services:
          type: array
          items:
            type: object
            properties:
              service_id:
                type: integer
              name:
                type: string
              limit:
                type:
                - integer
                - 'null'
              used:
                type:
                - integer
                - 'null'
    ContainerEgress:
      type: object
      description: 'Public IPv4 addresses the containers of the environment reach the internet from (no NAT gateway: traffic leaves from the node the container runs
        on).'
      x-description-tr: 'Ortamdaki kapsayıcıların internete çıktığı IPv4 adresleri (NAT kapısı yok: trafik kapsayıcının çalıştığı düğümden çıkar).'
      properties:
        mode:
          type: string
          enum:
          - dedicated
          - serverless
        ips:
          type: array
          items:
            type: string
            format: ipv4
          description: Put ALL of them on the IP allow list of an external service.
          example:
          - 31.58.248.114
          - 45.87.174.168
        items:
          type: array
          items:
            type: object
            properties:
              ip:
                type: string
              source:
                type: string
                enum:
                - node
                - rollout
                - shared_pool
                description: node = a node of the dedicated pool (always used); rollout = shared pool where the new copy starts during an update (about a minute)
                  before it moves back; shared_pool = serverless pool node
              node:
                type: string
                example: node-1
        build_ips:
          type: array
          items:
            type: string
          description: Gyro Pipeline build machines (git clone / archive download only)
        hash:
          type: string
          description: changes whenever `ips` change (compare to detect a change)
        ipv6:
          type: boolean
          const: false
          description: no IPv6 egress
        note:
          type: string
    ContainerEnvironment:
      type: object
      properties:
        code:
          type: string
          example: ab12cd
        namespace:
          type: string
          example: t-canli-12345
          description: Kubernetes namespace of the environment
        mode:
          type: string
          enum:
          - dedicated
          - serverless
        cluster_dns:
          type: object
          description: 'in-cluster addressing: from the same environment a service is reached at `<service>.<namespace>.svc.cluster.local:80` or `<service>:80` (port
            80 is forwarded to the container port; only services with a port)'
          properties:
            namespace:
              type: string
            service_domain:
              type: string
              example: t-canli-12345.svc.cluster.local
            service_port:
              type: integer
              const: 80
            pattern:
              type: string
              example: <service>.t-canli-12345.svc.cluster.local:80
            short_pattern:
              type: string
              example: <service>:80
        host_suffix:
          type: string
          example: -ab12cd.gyroapp.net
        suspended:
          type: boolean
        services:
          type: integer
        ready_replicas:
          type: integer
        limits:
          type: object
        nodes:
          type: array
          items:
            type: object
        quota:
          type: object
        ingress_ips:
          type: array
          items:
            type: string
          description: inbound address (apex A record of a custom domain)
        egress_ips:
          type: array
          items:
            type: string
          description: same as egress.ips
        egress_note:
          type: string
        egress:
          $ref: '#/components/schemas/ContainerEgress'
