      x-summary-tr: Webhook oluştur (gizli anahtar bir kez döner)
      description: 'Deliveries are `POST` JSON with headers `X-Gyro-Event`, `X-Gyro-Delivery`, `X-Gyro-Timestamp` and

        `X-Gyro-Signature: sha256=HMAC_SHA256(secret, timestamp + "." + body)` (white-label resellers: `X-Webhook-*`).

        Reject requests whose timestamp is older than 5 minutes. Retries: exponential back-off, 8 attempts; 20 consecutive failures disable the webhook.

        '
      x-description-tr: 'Teslimler `POST` JSON''dur; başlıklar `X-Gyro-Event`, `X-Gyro-Delivery`, `X-Gyro-Timestamp` ve

        `X-Gyro-Signature: sha256=HMAC_SHA256(secret, timestamp + "." + body)` (beyaz etiketli bayi: `X-Webhook-*`).

        Zaman damgası 5 dakikadan eskiyse reddedin. Tekrar: üstel geri çekilme, 8 deneme; 20 ardışık hata webhook''u kapatır.

        '
      x-scope: webhooks
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - url
              properties:
                url:
                  type: string
                  format: uri
                events:
                  type: array
                  items:
                    $ref: '#/components/schemas/WebhookEvent'
                  description: empty = all
                description:
                  type: string
                customer_id:
                  type: integer
                  description: Reseller main key only
            example:
              url: https://hooks.example.com/gyro
              events:
              - service.active
              - invoice.paid
      responses:
        '201':
          description: Created (includes secret)
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    allOf:
                    - $ref: '#/components/schemas/Webhook'
                    - type: object
                      properties:
