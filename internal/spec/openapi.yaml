paths:
  /whoami:
    get:
      tags:
      - Account
      operationId: whoami
      summary: Describe the calling API key
      x-summary-tr: Çağıran API anahtarını göster
      x-scope: any
      responses:
        '200':
          description: Key details
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      id:
                        type: integer
                      type:
                        type: string
                        const: client
                      name:
                        type: string
                      permissions:
                        type: array
                        items:
                          type: string
                      owner_id:
                        type: integer
        '401':
          $ref: '#/components/responses/Unauthorized'
  /cloud/activity:
    get:
      tags:
      - Account
      operationId: listActivity
      summary: List write calls made with your API keys
      x-summary-tr: API anahtarlarınızla yapılan yazma çağrılarını listele
      description: Every non-GET call to `/cloud/...` is recorded for 365 days (method, path, scope, HTTP status, IP, key id). Request and response bodies are never
        stored.
      x-description-tr: '`/cloud/...` altındaki her GET dışı çağrı 365 gün saklanır (yöntem, yol, kapsam, HTTP durumu, IP, anahtar no). İstek ve yanıt gövdeleri saklanmaz.'
      x-scope: cloud_read
      parameters:
      - $ref: '#/components/parameters/Page'
      - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Activity page
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/ActivityEntry'
                  meta:
                    $ref: '#/components/schemas/PageMeta'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /cloud/products:
    get:
      tags:
      - Catalog
      operationId: listProducts
      summary: List orderable cloud server products
      x-summary-tr: Sipariş verilebilen bulut sunucu ürünlerini listele
      description: Prices are in the product currency, VAT excluded. `available=false` means temporarily out of stock.
      x-description-tr: Fiyatlar ürün para biriminde ve KDV hariçtir. `available=false` geçici olarak stokta yok demektir.
      x-scope: cloud_read
      parameters:
      - name: location
        in: query
        schema:
          type: string
          example: fsn1
        description: Filter by location code
      - name: server_type
        in: query
        schema:
          type: string
          example: cx23
        description: Filter by server type
      - $ref: '#/components/parameters/Page'
      - name: limit
        in: query
        schema:
          type: integer
          minimum: 1
          maximum: 100
          default: 100
      responses:
        '200':
          description: Products
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Product'
                  meta:
                    $ref: '#/components/schemas/PageMeta'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          $ref: '#/components/responses/Validation'
  /cloud/locations:
    get:
      tags:
      - Catalog
      operationId: listLocations
      summary: List locations with orderable products
      x-summary-tr: Sipariş verilebilen lokasyonları listele
      x-scope: cloud_read
      responses:
        '200':
          description: Locations
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Location'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /cloud/images:
    get:
      tags:
      - Catalog
      operationId: listImages
      summary: List operating system images
      x-summary-tr: İşletim sistemi imajlarını listele
      x-scope: cloud_read
      responses:
        '200':
          description: Images
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Image'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /cloud/ssh-keys:
    get:
      tags:
      - SSH keys
      operationId: listSshKeys
      summary: List SSH keys
      x-summary-tr: SSH anahtarlarını listele
      x-scope: cloud_read
      parameters:
      - $ref: '#/components/parameters/Page'
      - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: SSH keys
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/SshKey'
                  meta:
                    $ref: '#/components/schemas/PageMeta'
        '401':
          $ref: '#/components/responses/Unauthorized'
    post:
      tags:
      - SSH keys
      operationId: createSshKey
      summary: Add an SSH key
      x-summary-tr: SSH anahtarı ekle
      description: Accepts ssh-ed25519, ecdsa-sha2-nistp256/384/521, sk-ssh-ed25519 and ssh-rsa (2048 bit or more). At most 50 keys per account; fingerprints are
        unique per account.
      x-description-tr: ssh-ed25519, ecdsa-sha2-nistp256/384/521, sk-ssh-ed25519 ve ssh-rsa (en az 2048 bit) kabul edilir. Hesap başına en fazla 50 anahtar; parmak
        izi hesapta benzersizdir.
      x-scope: cloud_write
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - name
              - public_key
              properties:
                name:
                  type: string
                  minLength: 1
                  maxLength: 64
                  example: laptop
                public_key:
                  type: string
                  example: ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIFaA... me@laptop
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/SshKey'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/Validation'
  /cloud/ssh-keys/{id}:
    parameters:
    - name: id
      in: path
      required: true
      schema:
        type: integer
    get:
      tags:
      - SSH keys
      operationId: getSshKey
      summary: Get an SSH key
      x-summary-tr: SSH anahtarını getir
      x-scope: cloud_read
      responses:
        '200':
          description: SSH key
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/SshKey'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      tags:
      - SSH keys
      operationId: deleteSshKey
      summary: Delete an SSH key
      x-summary-tr: SSH anahtarını sil
      description: Removes the key from your account. Servers that already have it keep it.
      x-description-tr: Anahtarı hesabınızdan siler. Anahtarın kurulu olduğu sunucularda anahtar kalır.
      x-scope: cloud_write
      responses:
        '200':
          description: Deleted
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      deleted:
                        type: boolean
                      id:
                        type: integer
        '404':
          $ref: '#/components/responses/NotFound'
  /cloud/servers:
    get:
      tags:
      - Servers
      operationId: listServers
      summary: List cloud servers
      x-summary-tr: Bulut sunucuları listele
      x-scope: cloud_read
      parameters:
      - name: status
        in: query
        schema:
          type: string
          enum:
          - active
          - waiting
          - inprocess
          - suspended
          - cancelled
      - $ref: '#/components/parameters/Page'
      - name: limit
        in: query
        schema:
          type: integer
          minimum: 1
          maximum: 100
          default: 25
      responses:
        '200':
          description: Servers (without live state)
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Server'
                  meta:
                    $ref: '#/components/schemas/PageMeta'
        '401':
          $ref: '#/components/responses/Unauthorized'
    post:
      tags:
      - Servers
      operationId: createServer
      summary: Create (order) a cloud server
      x-summary-tr: Bulut sunucu oluştur (sipariş)
      description: "Places an order and pays it **from your account balance** (never from a stored card).\nSafety rules:\n* send `\"dry_run\": true` first to get\
        \ a price quote; nothing is created;\n* a real order needs `\"confirm\": true` **and** an `Idempotency-Key` header — retrying with the\n  same key and body\
        \ returns the first answer (`Idempotency-Replayed: true`) instead of a second order;\n* the operator may cap the number of servers per account (`409 server_limit`).\n\
        Provisioning is asynchronous (typically under a minute): poll `GET /cloud/servers/{id}` until\n`status` is `active` and `live.power_state` is `running`.\n"
      x-description-tr: "Sipariş oluşturur ve **hesap bakiyenizden** öder (kayıtlı karttan asla çekmez).\nGüvenlik kuralları:\n* önce `\"dry_run\": true` ile fiyat\
        \ teklifi alın; hiçbir şey oluşturulmaz;\n* gerçek sipariş için `\"confirm\": true` **ve** `Idempotency-Key` başlığı zorunludur — aynı anahtar ve\n  gövdeyle\
        \ tekrar denemek ikinci sipariş yerine ilk yanıtı döndürür (`Idempotency-Replayed: true`);\n* yönetici hesap başına sunucu sınırı koyabilir (`409 server_limit`).\n\
        Kurulum eşzamansızdır (genellikle bir dakikadan kısa): `status` `active` ve `live.power_state`\n`running` olana kadar `GET /cloud/servers/{id}` ile sorgulayın.\n"
      x-scope: cloud_order
      parameters:
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateServerRequest'
            example:
              product_id: 723
              cycle: monthly
              image: debian-12
              ssh_keys:
              - 12
              hostname: web-1.example.com
              confirm: true
      responses:
        '200':
          description: Dry-run quote (nothing created)
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      dry_run:
                        type: boolean
                        const: true
                      quote:
                        $ref: '#/components/schemas/Quote'
        '202':
          description: Order placed and paid; the server is being provisioned
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/CreateServerResult'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '402':
          $ref: '#/components/responses/PaymentRequired'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/Validation'
  /cloud/servers/{id}:
    parameters:
    - $ref: '#/components/parameters/ServerId'
    get:
      tags:
      - Servers
      operationId: getServer
      summary: Get a server with its live state
      x-summary-tr: Sunucuyu canlı durumuyla getir
      description: '`live` is read from the platform (cached for 15 seconds) and is `null` while the server is not active.'
      x-description-tr: '`live` platformdan okunur (15 saniye önbellek) ve sunucu etkin değilken `null` olur.'
      x-scope: cloud_read
      responses:
        '200':
          description: Server
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/ServerDetail'
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      tags:
      - Servers
      operationId: updateServer
      summary: Rename a server or switch auto-renew
      x-summary-tr: Sunucu adını değiştir veya otomatik yenilemeyi aç/kapat
      x-scope: cloud_write
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                hostname:
                  type: string
                  description: Fully qualified host name (max 63 characters)
                  example: web-1.example.com
                auto_renew:
                  type: boolean
      responses:
        '200':
          description: Updated server
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/ServerDetail'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/Validation'
    delete:
      tags:
      - Servers
      operationId: deleteServer
      summary: Delete (cancel) a server
      x-summary-tr: Sunucuyu sil (iptal)
      description: "Requires `confirm=true` (query or body). Two modes:\n* default: files a **cancellation request** (`status: cancellation_requested`). The server\
        \ keeps running and billing\n  continues until the request is processed by the panel's automation (daily, business hours);\n* `immediate=true`: cancels **now**\
        \ (`status: cancelling`, becomes `cancelled` within about a minute) - billing stops, the server is powered off at once and destroyed with\n  its data after\
        \ the grace period (3 days). Same effect as an approved \"cancel now\" request in the panel. The operator can disable this.\nCalling it again is safe.\n"
      x-description-tr: "`confirm=true` (sorgu veya gövde) zorunludur. İki biçim:\n* varsayılan: **iptal talebi** açar (`status: cancellation_requested`); talep panel\
        \ otomasyonuyla işlenene kadar (günlük,\n  mesai saatleri) sunucu çalışır ve faturalama sürer;\n* `immediate=true`: **hemen** iptal eder (`status: cancelling`,\
        \ yaklaşık bir dakikada `cancelled`) - faturalama durur, sunucu hemen kapanır, bekleme süresi (3 gün) sonunda\n  verisiyle silinir. Paneldeki onaylanmış \"\
        hemen iptal\" ile aynı etki. Yönetici kapatabilir.\nTekrar çağırmak güvenlidir.\n"
      x-scope: cloud_delete
      parameters:
      - name: confirm
        in: query
        required: true
        schema:
          type: boolean
      - name: immediate
        in: query
        required: false
        schema:
          type: boolean
          default: false
        description: true = cancel now instead of filing a request
      responses:
        '202':
          description: Cancellation requested (default) or cancelled (immediate)
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      status:
                        type: string
                        enum:
                        - cancellation_requested
                        - cancelling
                        - cancelled
                      server_id:
                        type: integer
                      destroy_after_days:
                        type: integer
                      note:
                        type: string
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/Validation'
  /cloud/servers/{id}/actions/{action}:
    parameters:
    - $ref: '#/components/parameters/ServerId'
    - name: action
      in: path
      required: true
      schema:
        type: string
        enum:
        - poweron
        - shutdown
        - reboot
        - poweroff
        - reset
        - rebuild
        - reset_password
        - enable_rescue
        - disable_rescue
      description: '`shutdown` = graceful (ACPI), `poweroff` = hard power cut, `reset` = hard reset (needs confirm),

        `rebuild` = reinstall from `image` (needs confirm, **wipes the disk**), `reset_password` / `enable_rescue`

        return a one-time `root_password`.

        '
    post:
      tags:
      - Server actions
      operationId: serverAction
      summary: Run a server action
      x-summary-tr: Sunucu işlemi çalıştır
      description: 'Heavy actions (rebuild, reset, rescue, snapshot restore, password reset) are limited per server per day.

        A one-time `root_password` is returned only when the request has **no** `Idempotency-Key`

        (idempotent answers are stored for replay, secrets never are; you then get `root_password_withheld: true`).

        '
      x-description-tr: 'Ağır işlemler (yeniden kurulum, reset, kurtarma, snapshot''tan dönüş, parola sıfırlama) sunucu başına günlük sınırlıdır.

        Tek seferlik `root_password` yalnız istekte `Idempotency-Key` **yoksa** döner (tekrar için saklanan yanıtlara sır yazılmaz;

        bu durumda `root_password_withheld: true` görürsünüz).

        '
      x-scope: cloud_write
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                image:
                  type: string
                  description: 'rebuild only: image slug from /cloud/images'
                  example: ubuntu-24.04
                confirm:
                  type: boolean
                  description: required for reset and rebuild
      responses:
        '202':
          description: Accepted
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/ActionResult'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/Validation'
