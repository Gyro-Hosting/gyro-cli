          description: image reference to use in a service
        repo:
          type: string
        tag:
          type: string
        state:
          type: string
          enum:
          - running
          - done
          - failed
        phase:
          type: string
          enum:
          - queued
          - auth
          - manifest
          - layers
          - finalize
          - done
        bytes_total:
          type: integer
        bytes_done:
          type: integer
        layers:
          type: integer
        layers_done:
          type: integer
        digest:
          type: string
        platform:
          type: string
