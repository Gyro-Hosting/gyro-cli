        private:
          type: boolean
          description: credentials were used (not stored)
        error:
          type: string
          description: source_blocked, insecure_source, source_unauthorized, source_not_found, source_unreachable, source_tls, source_rate_limited, source_error,
            source_corrupt, platform_unsupported, not_an_image, unsupported_image, too_many_layers, manifest_too_large, registry_full, import_timeout, interrupted,
            import_failed
        message:
          type: string
        started:
          type: string
          format: date-time
        updated:
          type: string
          format: date-time
        finished:
          type: string
          format: date-time
    ContainerPipeline:
      type: object
      properties:
        id:
          type: string
          example: p1a2b3c4d
        name:
          type: string
          example: web
        provider:
          type: string
          enum:
          - github
          - gitlab
