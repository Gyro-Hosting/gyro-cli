        pipeline:
          type: string
        n:
          type: integer
          description: run number of the pipeline
        trigger:
          type: string
          enum:
          - push
          - tag
          - manual
          - api
          - redeploy
          - archive
        ref:
          type: string
          example: refs/heads/main
        sha:
          type: string
        short_sha:
          type: string
        message:
          type: string
        author:
          type: string
        state:
          type: string
          enum:
          - queued
          - preparing
          - building
          - awaiting_approval
          - deploying
          - verifying
          - succeeded
          - failed
          - cancelled
          - rolled_back
          - skipped
          - expired
        step:
          type: string
          enum:
          - prepare
          - queued_node
          - starting
          - clone
          - steps
          - build
          - approval
          - deploy
          - verify
