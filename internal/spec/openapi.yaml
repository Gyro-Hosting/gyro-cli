  /cloud/containers/{id}/registry/imports:
    post:
      tags:
      - Containers
      operationId: importContainerImage
      summary: Import an image from another registry
      x-summary-tr: Başka bir depodan imaj içe aktar
      x-scope: services_write
      x-cli:
        command: container registry import
      description: 'Copies an image (e.g. `nginx:1.27`, `docker.io/library/redis:7`, `ghcr.io/gyro-ornek/uygulama:1.0`) into the environment''s Gyro registry without
        `docker push`. HTTPS registries only; only the linux/amd64 variant of multi-platform images is copied. `repo` (default: last part of the source name) and
        `tag` (default: source tag) name the copy under `<host>/<code>/`; an existing name:tag needs `overwrite: true`. Private images: `username` + `password` (token)
        are used only for this copy, never stored or returned, and redacted in the API log. Runs in the background: poll GET .../registry/imports. Limits: 1 running
        import per environment (409 `import_running`), 10 per hour (429 `import_rate_limited`), 15 minutes, 128 layers, size within the free registry space (50 GB
        cap, 2 GB free, then the usual €0.05/GB-month). Sources that resolve to private, internal or Gyro infrastructure addresses are refused (`source_blocked`).'
      x-description-tr: 'Bir imajı (ör. `nginx:1.27`, `ghcr.io/gyro-ornek/uygulama:1.0`) `docker push` gerekmeden ortamın Gyro imaj deposuna kopyalar. Yalnız https
        depolar; çok mimarili imajlarda yalnız linux/amd64 kopyalanır. `repo` (varsayılan: kaynak adının son parçası) ve `tag` (varsayılan: kaynak etiketi) kopyanın
        adıdır; var olan ad:etiket için `overwrite: true` gerekir. Özel imaj: `username` + `password` (token) yalnız bu kopya için kullanılır, saklanmaz, geri dönmez,
        API günlüğünde karartılır. Arka planda çalışır: GET .../registry/imports ile izleyin. Sınırlar: ortam başına aynı anda 1 (409 `import_running`), saatte 10
        (429 `import_rate_limited`), 15 dakika, 128 katman, boyut deponuzdaki boş alanı aşamaz. İç/özel/Gyro altyapı adreslerine çözülen kaynaklar reddedilir (`source_blocked`).'
      parameters: &id042
      - name: id
        in: path
        required: true
        schema:
          type: integer
        description: Container environment (service) id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - source
              properties:
                source:
                  type: string
                  example: nginx:1.27
                  description: source image (host/repo:tag or @sha256:...); docker.io when no host
                  x-description-tr: kaynak imaj (host/depo:etiket ya da @sha256:...); host yoksa docker.io
                repo:
                  type: string
                  example: nginx
                  description: target name under your prefix (lowercase, max 3 levels)
                  x-description-tr: hedef ad (küçük harf, en çok 3 seviye)
                tag:
                  type: string
                  example: '1.27'
                  description: 'target tag (default: source tag, `latest` for a digest)'
                  x-description-tr: hedef etiket
                username:
                  type: string
                  description: 'private source: username (not stored)'
                  x-description-tr: 'özel kaynak: kullanıcı adı (saklanmaz)'
                password:
                  type: string
                  format: password
                  description: 'private source: token / password (not stored, redacted in logs)'
                  x-description-tr: 'özel kaynak: token / parola (saklanmaz)'
                overwrite:
                  type: boolean
                  default: false
                  description: replace an existing name:tag
                  x-description-tr: var olan ad:etiketin üzerine yaz
            example:
              source: ghcr.io/gyro-ornek/uygulama:1.0
              repo: uygulama
              tag: '1.0'
      responses:
        '202':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      job:
                        $ref: '#/components/schemas/ContainerImageImport'
                      limits:
                        type: object
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/Validation'
        '429':
          description: import_rate_limited
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    get:
      tags:
      - Containers
      operationId: listContainerImageImports
      summary: Image imports (progress and history)
      x-summary-tr: İmaj içe aktarmaları (ilerleme ve geçmiş)
      x-scope: services_read
      x-cli:
        command: container registry imports
      description: '`active` = the running import (or null) with `phase`, `bytes_done`/`bytes_total`, `layers_done`/`layers`; `jobs` = the last 20 imports (newest
        first) with `state` and, when failed, `error` + `message`; `limits`.'
      x-description-tr: '`active` = süren içe aktarma (ya da null): `phase`, bayt ve katman ilerlemesi; `jobs` = son 20 içe aktarma (yeniden eskiye), başarısızsa
        `error` + `message`; `limits`.'
      parameters: *id042
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      active:
                        oneOf:
