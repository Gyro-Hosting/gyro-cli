        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                protocol:
                  type: string
                  enum:
                  - tcp
                  - http
                  - https
                listen_port:
                  type: integer
                  description: Port the load balancer listens on
                destination_port: &id012
                  type: integer
                  description: Port on the targets
                proxyprotocol: &id013
                  type: boolean
                  description: Send PROXY protocol header to targets
                hc_protocol: &id014
                  type: string
                  enum:
                  - tcp
                  - http
                  description: Health check type
                hc_port: &id015
                  type: integer
                hc_interval: &id016
                  type: integer
                  description: 3-60 s
                hc_timeout: &id017
                  type: integer
                  description: 1-30 s, below interval
                hc_retries: &id018
                  type: integer
                  description: 0-5
                hc_path: &id019
                  type: string
                  description: HTTP check path (starts with /)
                hc_domain: &id020
                  type: string
                  description: HTTP check Host header
                hc_status_codes: &id021
                  type: string
                  description: Comma separated, e.g. 2??,3??
                hc_tls: &id022
                  type: boolean
                  description: HTTP check over TLS
                sticky: &id023
                  type: boolean
                  description: Sticky sessions (cookie)
                cookie_name: &id024
                  type: string
                cookie_lifetime: &id025
                  type: integer
                idle_timeout: &id026
                  type: integer
                  description: Idle timeout (s)
                certificates: &id027
                  type: string
                  description: 'HTTPS: comma separated certificate ids of this load balancer'
                redirect_http: &id028
                  type: boolean
                  description: 'HTTPS: redirect port 80 to HTTPS (port 80 must be free)'
                confirm:
                  type: boolean
              required:
