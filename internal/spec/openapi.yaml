                $ref: '#/components/schemas/Error'
        '422':
          $ref: '#/components/responses/Validation'
        '501':
          description: not_supported (not a tr-ist-1 Gyro Compute server)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    post:
      tags:
      - Networking
      operationId: addServerIps
      summary: Add additional IPv4 addresses
      x-summary-tr: Ek IPv4 adresi ekle
      x-scope: cloud_write
      x-cli:
        command: server ip add
        money: true
      description: '**Minimum charge:** each added IP is billed for at least 6 hours (`pricing.minimum_hours`): releasing it earlier still bills the minimum (debited
        at release), and taking the same address again starts a new minimum. At most `adds_per_hour` addresses (default 10) can be added to a server per 60 minutes.
        Additional IPv4 addresses are billed per address hourly from the prepaid balance (default 2 EUR per address-month, `pricing` shows the current price), from
        the hour they are added until they are released. Up to `max` per server (default 5). Each address is configured on the server automatically (/32 on the primary
        interface, kept across reboots and reinstalls); reverse DNS: PUT /cloud/servers/{id}/rdns. Prepaid tr-ist-1 servers only; not while the server is suspended.'
      x-description-tr: '**Asgari ücret:** her eklenen IP en az 6 saat ücretlendirilir (`pricing.minimum_hours`): daha erken bırakılsa da asgari süre (bırakırken)
        düşülür; aynı adresi yeniden almak yeni bir asgari süre başlatır. Bir sunucuya 60 dakikada en çok `adds_per_hour` (varsayılan 10) adres eklenebilir. Ek IPv4
        adresleri adres başına ön ödemeli bakiyeden saatlik ücretlendirilir (varsayılan adres başına aylık 2 €, güncel fiyat `pricing` alanında); eklendiği saatten
        çıkarıldığı saate kadar. Sunucu başına en çok `max` (varsayılan 5). Adres sunucuya otomatik tanımlanır (birincil arayüze /32, yeniden başlatma ve yeniden
        kurulumda korunur); ters DNS: PUT /cloud/servers/{id}/rdns. Yalnız ön ödemeli tr-ist-1 sunucuları; askıdayken eklenemez.'
      parameters:
      - *id051
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                count:
                  type: integer
                  minimum: 1
                  maximum: 16
                  default: 1
      responses:
        '201':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/ServerIps'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: not_actionable (suspended / busy)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          $ref: '#/components/responses/Validation'
        '501':
          description: not_supported (not a tr-ist-1 Gyro Compute server)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /cloud/servers/{id}/ips/{ip}:
    delete:
      tags:
      - Networking
      operationId: removeServerIp
      summary: Release an additional IPv4 address
      x-summary-tr: Ek IPv4 adresini bırak
      x-scope: cloud_write
      x-cli:
        command: server ip remove
        confirm: true
      description: '**Minimum charge:** each added IP is billed for at least 6 hours (`pricing.minimum_hours`): releasing it earlier still bills the minimum (debited
        at release), and taking the same address again starts a new minimum. At most `adds_per_hour` addresses (default 10) can be added to a server per 60 minutes.
        The address is removed from the server and returns to the pool (getting the same address back is not guaranteed); billing stops at release (the minimum still
        applies). Needs `confirm=true`.'
      x-description-tr: '**Asgari ücret:** her eklenen IP en az 6 saat ücretlendirilir (`pricing.minimum_hours`): daha erken bırakılsa da asgari süre (bırakırken)
        düşülür; aynı adresi yeniden almak yeni bir asgari süre başlatır. Bir sunucuya 60 dakikada en çok `adds_per_hour` (varsayılan 10) adres eklenebilir. Adres
        sunucudan kaldırılır ve havuza döner (aynı adresi geri alma garantisi yok); ücret bırakınca durur (asgari süre yine uygulanır). `confirm=true` gerekir.'
      parameters:
      - *id051
      - name: ip
        in: path
        required: true
        schema:
          type: string
      - name: confirm
        in: query
        required: true
        schema:
          type: boolean
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/ServerIps'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: not_actionable (suspended / busy)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          $ref: '#/components/responses/Validation'
        '501':
          description: not_supported (not a tr-ist-1 Gyro Compute server)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: wck_ + 32 characters
      description: "Client API key. Scopes: `Module:Addons/GyroAPI/cloud_read`, `.../cloud_write`, `.../cloud_order` (spends balance),\n`.../cloud_delete`, plus core\
        \ scopes such as `Invoices/GetInvoices`, `Balance/GetBalance`. Optional IP allow list per key.\nDefault limit 60 requests per minute per key (`X-RateLimit-*`\
        \ headers, `429` with `Retry-After`).\n v2 scopes: `services_read`, `services_write`, `webhooks`, `keys`, `reseller`, `billing_pay`, `billing_read`, `users`\
        \ (all under `Module:Addons/GyroAPI/`). ACME keys carry only `dns_acme`."
  parameters:
    ServerId:
      name: id
      in: path
      required: true
      schema:
        type: integer
      description: Server id (= service id in the client area)
    Page:
      name: page
      in: query
      schema:
        type: integer
        minimum: 1
        default: 1
    Limit:
      name: limit
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 50
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema:
        type: string
        minLength: 8
        maxLength: 191
      description: Unique per logical request (e.g. a UUID). Replays within 24 hours return the stored answer.
  responses:
    BadRequest:
      description: Malformed request (e.g. missing Idempotency-Key)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Unauthorized:
      description: Missing, invalid or revoked key
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    PaymentRequired:
      description: Account balance does not cover the order (`insufficient_balance`)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Forbidden:
      description: Key lacks the scope, IP not allowed, or feature disabled
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    NotFound:
      description: Not found — also returned for objects owned by someone else
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Conflict:
      description: State conflict (`server_locked`, `not_actionable`, `ssh_key_exists`, `server_limit`, `idempotency_in_flight`)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Validation:
      description: Validation or business rule failure (`confirm_required`, `invalid_image`, `tool_action_failed` ...)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    RateLimited:
      description: Too many requests (`rate_limited`); see the `Retry-After` and `X-RateLimit-*` headers
      headers:
        Retry-After:
          description: Seconds to wait
          schema:
            type: integer
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
  schemas:
    Error:
      type: object
      required:
      - error
      properties:
        error:
          type: object
          required:
          - code
          - message
          properties:
            code:
              type: string
              example: server_not_found
            message:
              type: string
            details:
              type: object
              additionalProperties: true
    PageMeta:
      type: object
      properties:
        total:
          type: integer
        page:
          type: integer
        limit:
          type: integer
        next_page:
          type: integer
          description: 0 when this is the last page
    Money:
      type: object
      properties:
        amount:
          type: number
        currency:
          type:
          - string
          - 'null'
          example: TRY
    Price:
      type: object
      properties:
        cycle:
          type: string
          example: monthly
        amount:
          type: number
        setup:
          type: number
        currency:
          type: string
        monthly_cap:
          type: number
          description: 'prepaid only: most charged per calendar month (Europe/Istanbul)'
        billing:
          type: string
          enum:
          - prepaid
          description: prepaid only
    Product:
      type: object
      properties:
        id:
          type: integer
          example: 723
        name:
          type: string
          example: Gyro Bulut Standart 2-4
        plan:
          type: string
          example: standart-2-4
          description: Plan name (use it with region when ordering)
        region:
          type: string
          example: eu-de-1
          description: Gyro region
        server_type:
          type: string
          deprecated: true
          description: Legacy type code (kept for backward compatibility; use plan)
        location:
          type: string
          deprecated: true
          description: Legacy location code (kept for backward compatibility; use region)
        cores:
          type:
          - integer
          - 'null'
        memory_gb:
          type:
          - number
          - 'null'
        disk_gb:
          type:
          - integer
          - 'null'
        cpu_type:
          type:
          - string
          - 'null'
          enum:
          - shared
          - dedicated
          - null
        architecture:
          type:
          - string
          - 'null'
          example: x86
        traffic_tb:
          type:
          - number
          - 'null'
        ipv4:
          type: boolean
        ipv6:
          type: boolean
        available:
          type: boolean
        prices:
          type: array
          items:
            $ref: '#/components/schemas/Price'
        product_line:
          type: string
          enum:
          - cloud_server
          - vds
          description: 'cloud_server (Gyro Cloud: global regions and tr-ist-1) or vds (Istanbul VDS line)'
        billing:
          type: string
          enum:
          - invoice
          - prepaid
          description: invoice = paid per billing cycle (invoice). prepaid = charged hourly from the account balance (no invoice); `prices` then holds one `hourly`
            entry with `monthly_cap` (at most this much per calendar month).
    Location:
      type: object
      properties:
        region:
          type: string
          example: eu-de-1
          description: Gyro region name
        code:
          type: string
          deprecated: true
          description: Legacy location code (use region)
        city:
          type: string
          example: Falkenstein
        country:
          type: string
          example: DE
        zone:
          type: string
          example: eu-central
        products:
          type: integer
    Image:
