                properties:
                  data:
                    type: object
                    additionalProperties: true
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          description: 'invalid_env: unknown field or nothing to change (details.expected lists set / unset / replace)'
