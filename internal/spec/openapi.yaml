                        - type: 'null'
                      jobs:
                        type: array
                        items:
                          $ref: '#/components/schemas/ContainerImageImport'
                      limits:
                        type: object
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/Validation'
