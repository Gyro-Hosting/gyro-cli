        max_replicas:
          type:
          - integer
          - 'null'
          description: most replicas per service (autoscaling)
        max_domains:
          type:
          - integer
          - 'null'
        billing:
          type: string
          const: prepaid
        currency:
          type: string
        monthly_cap_eur:
          type:
          - number
          - 'null'
        hourly_eur:
          type:
          - number
          - 'null'
        usage:
          type:
          - object
          - 'null'
          properties:
            vcpu_hour_eur:
              type: number
            gb_hour_eur:
              type: number
    ContainerImageImport:
      type: object
