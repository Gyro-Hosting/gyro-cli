      x-cli:
        command: security-group rules set
      description: 'Full replace (inbound + outbound), max 60 rules. Applied to every attached server. If the change removes or narrows SSH (22) / RDP (3389) access
        for any source on an attached server, or cuts the calling address, it runs as a 5 minute trial (`trial: true`, `trial_seconds_left`) - the same rule as the
        panel, CLI and Terraform: confirm with POST .../confirm, otherwise the previous rules return. A server''s rules (own + all attached groups) must fit its allowance
        (422 err_sg_quota).'
      x-description-tr: 'Tam değiştirme (gelen + giden), en çok 60 kural. Bağlı tüm sunuculara uygulanır. Bağlı bir sunucuda herhangi bir kaynağın SSH (22) / RDP
        (3389) erişimini kaldırıyor ya da daraltıyorsa veya çağıran adresi kesiyorsa 5 dakikalık deneme olur (`trial: true`, `trial_seconds_left`) - panel, CLI ve
        Terraform ile aynı kural: .../confirm ile onaylayın, yoksa önceki kurallar döner. Sunucunun kuralları (kendi + bağlı tüm gruplar) hakkına sığmalı (422 err_sg_quota).'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - rules
              properties:
                rules:
                  type: array
                  items:
                    $ref: '#/components/schemas/SecurityGroupRule'
            example:
              rules:
              - type: https
                source:
                - 0.0.0.0/0
              - type: ssh
                source:
                - 203.0.113.10/32
                description: office
              - direction: out
                type: all
                source:
                - 0.0.0.0/0
      responses:
        '200':
          description: Group (trial, corrections)
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/SecurityGroup'
