      description: 'Creates a bucket. Object Storage: the name is private to the service. Protected Storage: every bucket is versioned and the name gets the service
        code suffix (`<name>-<code>`); `object_lock: true` creates a WORM bucket (needs a free locked-bucket right: Object Lock add-on, see `GET /cloud/storage/{id}/object-lock`).
        Object lock can only be chosen at creation and never turned off. `object_lock: true` on a standard Object Storage service answers 409 `feature_not_available`.
        Needs `"confirm": true`.'
      x-description-tr: 'Kova oluşturur. Nesne Depolama: ad hizmete özeldir. Korumalı Depolama: her kova sürümlüdür ve ada hizmet kodu eklenir (`<ad>-<kod>`); `object_lock:
        true` WORM kovası açar (boş kilitli kova hakkı gerekir: Nesne Kilidi ek hizmeti, bkz. `GET /cloud/storage/{id}/object-lock`). Nesne kilidi yalnız açılışta
        seçilir, sonradan kapatılamaz. Standart Nesne Depolama''da `object_lock: true` 409 `feature_not_available` döner. `"confirm": true` gerekir.'
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
        description: Service id
      responses:
